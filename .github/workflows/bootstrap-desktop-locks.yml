name: Bootstrap Desktop Locks

on:
  pull_request:

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-lock-bootstrap-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  materialize-reviewed-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Verify source head lineage
        shell: bash
        env:
          REVIEWED_HEAD: 634a7f69da587937eeb5f5ad7607a1bb19e9bdd6
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REVIEWED_HEAD" HEAD
      - name: Stop if lockfiles are already tracked
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch apps/desktop/package-lock.json >/dev/null 2>&1 \
             && git ls-files --error-unmatch apps/desktop/src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Download exact lock artifact from reviewed Windows run
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .lock-bootstrap
          gh run download 34975694103 --name desktop-lockfiles --dir .lock-bootstrap
          test -s .lock-bootstrap/package-lock.json
          test -s .lock-bootstrap/src-tauri/Cargo.lock
          cp .lock-bootstrap/package-lock.json apps/desktop/package-lock.json
          cp .lock-bootstrap/src-tauri/Cargo.lock apps/desktop/src-tauri/Cargo.lock
          rm -rf .lock-bootstrap
      - name: Validate and commit only lockfiles
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool apps/desktop/package-lock.json >/dev/null
          grep -q '^version = 4$' apps/desktop/src-tauri/Cargo.lock
          git add apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock
          mapfile -t changed < <(git diff --cached --name-only | sort)
          expected=(apps/desktop/package-lock.json apps/desktop/src-tauri/Cargo.lock)
          test "${changed[*]}" = "${expected[*]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "HCODER-WO-0015: materialize reviewed desktop lockfiles"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
