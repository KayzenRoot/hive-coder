name: Desktop Shell

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Desktop security gate
        run: python tools/desktop/security_gate.py
      - name: Product version drift gate
        run: python tools/desktop/version_drift.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Component and contract tests
        working-directory: apps/desktop
        run: npm test
      - name: Production web build
        working-directory: apps/desktop
        run: npm run build:web
      - name: Full npm dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=high

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber
          node --version
          rustc --version
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-desktop-windows-v1
      - name: Install pinned RustSec cargo-audit
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab
        with:
          tool: cargo-audit@0.22.2
          fallback: none
      - name: Audit locked Rust dependency graph
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
      - name: Adversarial offline glib patch provenance tests
        run: python -m unittest tests.desktop.test_glib_patch_provenance
      - name: Bootstrap exact authenticated glib 0.18.5 source
        run: python tools/desktop/bootstrap_glib_patch.py
      - name: Build exact-glib-only legacy lint wrapper
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "hcoder-glib-rustc-wrapper.exe"
          rustc --edition=2021 -D warnings -O tools/desktop/glib_rustc_wrapper.rs -o $exe
          if ($LASTEXITCODE -ne 0) { throw "rustc wrapper compile failed" }
          $tests = Join-Path $env:RUNNER_TEMP "hcoder-glib-wrapper-tests.exe"
          rustc --edition=2021 -D warnings --test tools/desktop/glib_rustc_wrapper.rs -o $tests
          if ($LASTEXITCODE -ne 0) { throw "rustc wrapper test compile failed" }
          & $tests
          if ($LASTEXITCODE -ne 0) { throw "rustc wrapper tests failed" }
          $lib = (Resolve-Path apps/desktop/src-tauri/vendor/glib-0.18.5/src/lib.rs).Path
          "RUSTC_WRAPPER=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "HCODER_GLIB_VENDOR_LIB=$lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Output "GLIB_LINT_ALLOWLIST_SCOPE=EXACT_PATCHED_CRATE_ONLY"
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Rust unit tests with locked graph
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust check with locked graph
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Tauri Windows build without bundle
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Windows desktop launch smoke
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "src-tauri\target\release\hive-coder-desktop.exe"
          if (-not (Test-Path $exe)) { throw "desktop executable missing: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw "Hive Coder desktop exited during launch smoke with code $($process.ExitCode)" }
            Write-Output "DESKTOP_LAUNCH_SMOKE=PASS"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }

  desktop-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head and Linux runner identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
          uname -a
          cat /etc/os-release
      - name: Install minimal Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-desktop-linux-v1
      - name: Toolchain identity
        run: |
          node --version
          rustc --version
          cargo --version
      - name: Adversarial offline glib patch provenance tests
        run: python -m unittest tests.desktop.test_glib_patch_provenance
      - name: Bootstrap exact authenticated glib 0.18.5 source
        run: python tools/desktop/bootstrap_glib_patch.py
      - name: Build exact-glib-only legacy lint wrapper
        shell: bash
        run: |
          set -euo pipefail
          exe="$RUNNER_TEMP/hcoder-glib-rustc-wrapper"
          rustc --edition=2021 -D warnings -O tools/desktop/glib_rustc_wrapper.rs -o "$exe"
          rustc --edition=2021 -D warnings --test tools/desktop/glib_rustc_wrapper.rs -o "$RUNNER_TEMP/hcoder-glib-wrapper-tests"
          "$RUNNER_TEMP/hcoder-glib-wrapper-tests"
          echo "RUSTC_WRAPPER=$exe" >> "$GITHUB_ENV"
          echo "HCODER_GLIB_VENDOR_LIB=$GITHUB_WORKSPACE/apps/desktop/src-tauri/vendor/glib-0.18.5/src/lib.rs" >> "$GITHUB_ENV"
          echo "GLIB_LINT_ALLOWLIST_SCOPE=EXACT_PATCHED_CRATE_ONLY"
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Rust unit tests with locked graph and Linux dialog backend
        run: cargo test --locked --features rfd/gtk3 --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Release-optimized regression on exact bootstrapped product glib
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/hcoder-glib-product-release"
          probe="$d/variant-regression"
          mkdir -p "$probe/tests"
          cat > "$probe/Cargo.toml" <<EOF
          [package]
          name = "hcoder-glib-variant-regression"
          version = "0.0.0"
          edition = "2024"
          publish = false
          [dependencies]
          glib = { path = "$GITHUB_WORKSPACE/apps/desktop/src-tauri/vendor/glib-0.18.5" }
          EOF
          cat > "$probe/tests/variant.rs" <<'RS'
          use glib::prelude::*;
          use glib::Variant;
          fn source() -> Variant {
              Variant::array_from_iter::<String>(
                  ["zero", "one", "two", "three", "four"]
                    .iter()
                    .map(|s| s.to_string().to_variant())
              )
          }
          #[test]
          fn combined_front_back_nth_and_nth_back() {
              let value=source();
              let mut it=value.array_iter_str().unwrap();
              assert_eq!(it.next(),Some("zero"));
              assert_eq!(it.next_back(),Some("four"));
              assert_eq!(it.nth(1),Some("two"));
              assert_eq!(it.nth_back(0),Some("three"));
              assert_eq!(it.next(),None);
              assert_eq!(it.next_back(),None);
          }
          #[test]
          fn iterator_last_and_empty() {
              let value=source();
              assert_eq!(value.array_iter_str().unwrap().last(),Some("four"));
              let empty=Variant::array_from_iter::<String>(Vec::<Variant>::new());
              let mut it=empty.array_iter_str().unwrap();
              assert_eq!(it.next(),None);
              assert_eq!(it.last(),None);
          }
          #[test]
          fn overflow_nth_and_nth_back_are_safe() {
              let value=source();
              let mut one=value.array_iter_str().unwrap();
              assert_eq!(one.nth(usize::MAX),None);
              assert_eq!(one.next(),None);
              let mut two=value.array_iter_str().unwrap();
              assert_eq!(two.nth_back(usize::MAX),None);
              assert_eq!(two.next_back(),None);
          }
          #[test]
          fn repeated_full_iteration() {
              let value=source();
              for _ in 0..100 {
                  let found:Vec<_>=value.array_iter_str().unwrap().collect();
                  assert_eq!(found,vec!["zero","one","two","three","four"]);
              }
          }
          RS
          cargo test --release --manifest-path "$probe/Cargo.toml" --test variant
          echo "OPTIMIZED_PATCHED_PRODUCT_GLIB_TESTS=PASS"
          git diff --quiet --exit-code
          echo "ORIGINAL_TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Rust check with locked graph and Linux dialog backend
        run: cargo check --locked --features rfd/gtk3 --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Tauri Linux build without bundle
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle --features rfd/gtk3

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head and macOS runner identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
          sw_vers
          uname -m
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-desktop-macos-v1
      - name: Toolchain identity
        run: |
          node --version
          rustc --version
          cargo --version
      - name: Adversarial offline glib patch provenance tests
        run: python -m unittest tests.desktop.test_glib_patch_provenance
      - name: Bootstrap exact authenticated glib 0.18.5 source
        run: python tools/desktop/bootstrap_glib_patch.py
      - name: Build exact-glib-only legacy lint wrapper
        shell: bash
        run: |
          set -euo pipefail
          exe="$RUNNER_TEMP/hcoder-glib-rustc-wrapper"
          rustc --edition=2021 -D warnings -O tools/desktop/glib_rustc_wrapper.rs -o "$exe"
          rustc --edition=2021 -D warnings --test tools/desktop/glib_rustc_wrapper.rs -o "$RUNNER_TEMP/hcoder-glib-wrapper-tests"
          "$RUNNER_TEMP/hcoder-glib-wrapper-tests"
          echo "RUSTC_WRAPPER=$exe" >> "$GITHUB_ENV"
          echo "HCODER_GLIB_VENDOR_LIB=$GITHUB_WORKSPACE/apps/desktop/src-tauri/vendor/glib-0.18.5/src/lib.rs" >> "$GITHUB_ENV"
          echo "GLIB_LINT_ALLOWLIST_SCOPE=EXACT_PATCHED_CRATE_ONLY"
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Rust unit tests with locked graph
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust check with locked graph
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Tauri macOS build without bundle
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
