name: Desktop Shell

on:
  pull_request:
  push:
    branches: [main]

jobs:
  desktop-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Desktop security gate
        run: python tools/desktop/security_gate.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck
      - name: Component and contract tests
        working-directory: apps/desktop
        run: npm test
      - name: Production web build
        working-directory: apps/desktop
        run: npm run build:web
      - name: Full npm dependency audit
        working-directory: apps/desktop
        run: npm audit --audit-level=high

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: false
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Rust unit tests with locked graph
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Rust check with locked graph
        run: cargo check --locked --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Tauri Windows build without bundle
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Windows desktop launch smoke
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "src-tauri\target\release\hive-coder-desktop.exe"
          if (-not (Test-Path $exe)) { throw "desktop executable missing: $exe" }
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "Hive Coder desktop exited during launch smoke with code $($process.ExitCode)"
            }
            Write-Output "DESKTOP_LAUNCH_SMOKE=PASS"
          }
          finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit()
            }
          }
