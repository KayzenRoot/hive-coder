name: Native Package Matrix

# Additional exact-head proof lane for HCODER-WO-0025. It neither replaces nor
# weakens Governance or Desktop Shell: those remain the canonical gates, and this
# lane only adds bounded, unsigned internal package evidence.
#
# Trigger law: this lane deliberately carries NO `pull_request` path filter. A
# Work Order correction that touches only governance, an ADR, the Decisions
# Ledger or the Context Lock still moves the promotion head, and that head must
# receive package evidence; a path filter cannot be proven complete against
# future correction paths, and an unmatched head would deadlock promotion.
#
# Version law: no package version or identifier is stored in this workflow. Every
# lane runs the existing version drift gate and derives both values from the
# canonical Tauri config at runtime.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
          Write-Output "CANARY_PLATFORM=windows"
          Write-Output "CANARY_ARCH=$env:PROCESSOR_ARCHITECTURE"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-native-package-windows-v1
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Record pinned CLI and advertised bundle targets
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $cli = (node -e "process.stdout.write(require('@tauri-apps/cli/package.json').version)")
          Write-Output "TAURI_CLI_VERSION=$cli"
          $help = (npm run tauri -- bundle --help 2>&1 | Out-String)
          $values = ($help -split "`n" | Select-String -Pattern 'possible values:' | Select-Object -First 1)
          Write-Output "BUNDLE_VALUES=$values"
          foreach ($target in @('msi', 'nsis')) {
            if ($values -notmatch $target) { throw "TARGET_NOT_ADVERTISED=$target" }
          }
      - name: Derive canonical version and identifier from Tauri config
        shell: pwsh
        run: |
          $drift = (python tools/desktop/version_drift.py | Out-String)
          Write-Output $drift.Trim()
          if ($LASTEXITCODE -ne 0 -or $drift -notmatch "VERSION_DRIFT=LOCKED") { throw "version drift gate is not LOCKED" }
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($config.version)) { throw "canonical version missing from Tauri config" }
          if ([string]::IsNullOrWhiteSpace($config.identifier)) { throw "canonical identifier missing from Tauri config" }
          "CANONICAL_VERSION=$($config.version)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CANONICAL_IDENTIFIER=$($config.identifier)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Output "CANONICAL_CONFIG_SOURCE=apps/desktop/src-tauri/tauri.conf.json"
          Write-Output "DERIVED_CANONICAL_VERSION=$($config.version)"
          Write-Output "DERIVED_CANONICAL_IDENTIFIER=$($config.identifier)"

      - name: Native compile without bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Create ephemeral bundle overlay (runner-local, non-tracked)
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP "hive-bundle-overlay.json"
          $iconIco = Join-Path $PWD "apps\desktop\src-tauri\icons\icon.ico"
          $iconPng = Join-Path $PWD "apps\desktop\src-tauri\icons\icon.png"
          foreach ($icon in @($iconIco, $iconPng)) {
            if (-not (Test-Path $icon)) { throw "generated icon missing: $icon" }
          }
          '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' | Set-Content -NoNewline -Encoding ascii $overlay
          Write-Output "OVERLAY_PATH=$overlay"
          Write-Output "OVERLAY_REQUIRED_FOR=msi"
          $before = (Get-FileHash apps\desktop\src-tauri\tauri.conf.json -Algorithm SHA256).Hash
          Write-Output "TAURI_CONF_SHA256_BEFORE=$before"
          "TAURI_CONF_BEFORE=$before" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Explicit bundle with ephemeral overlay
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP "hive-bundle-overlay.json"
          Remove-Item -Recurse -Force src-tauri\target\release\bundle -ErrorAction SilentlyContinue
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Output "BUNDLE_ATTEMPT=$attempt"
            npm run tauri -- bundle --bundles msi,nsis --ci --config $overlay
            if ($LASTEXITCODE -eq 0) { Write-Output "BUNDLE_RESULT=SUCCESS attempt=$attempt"; break }
            if ($attempt -eq 2) { throw "bundle step failed after $attempt attempts: $LASTEXITCODE" }
            Write-Output "BUNDLE_RESULT=RETRY attempt=$attempt"
            Start-Sleep -Seconds 15
          }
      - name: Guard tracked source and canonical config after bundling
        shell: pwsh
        run: |
          $after = (Get-FileHash apps\desktop\src-tauri\tauri.conf.json -Algorithm SHA256).Hash
          Write-Output "TAURI_CONF_SHA256_AFTER=$after"
          if ($after -ne $env:TAURI_CONF_BEFORE) { throw "canonical tauri.conf.json changed during packaging" }
          git diff --quiet --exit-code
          if ($LASTEXITCODE -ne 0) { throw "tracked source changed during packaging" }
          Write-Output "TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Native structural checks (no install, no execution)
        shell: pwsh
        run: |
          $root = "apps\desktop\src-tauri\target\release\bundle"
          $msi = Get-ChildItem -Path (Join-Path $root 'msi') -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem -Path (Join-Path $root 'nsis') -Filter *.exe | Select-Object -First 1
          if (-not $msi) { throw "msi artifact missing" }
          if (-not $nsis) { throw "nsis artifact missing" }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($msi.FullName,0))
          $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)
          $record = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
          $version = $record.GetType().InvokeMember('StringData','GetProperty',$null,$record,1)
          Write-Output "MSI_PRODUCT_VERSION=$version"
          if ($version -ne $env:CANONICAL_VERSION) { throw "msi version mismatch: $version" }
          $stream = [System.IO.File]::OpenRead($nsis.FullName)
          try { $head = New-Object byte[] 2; [void]$stream.Read($head,0,2) } finally { $stream.Close() }
          Write-Output ("NSIS_HEAD={0}{1}" -f [char]$head[0], [char]$head[1])
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "nsis artifact is not a PE image" }
          Write-Output "NSIS_BYTES=$($nsis.Length)"
          Write-Output "STRUCTURAL_CHECK_WINDOWS=PASS"
      - name: Deterministic package inventory
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $manifest = Join-Path $env:RUNNER_TEMP "hive-package-inventory.json"
          python tools/desktop/package_inventory.py `
            --package-root apps/desktop/src-tauri/target/release/bundle `
            --platform windows --architecture x86_64 `
            --source-sha $env:SOURCE_SHA --canonical-version $env:CANONICAL_VERSION `
            --expected-types msi,nsis --json-out $manifest
          if ($LASTEXITCODE -ne 0) { throw "package inventory failed: $LASTEXITCODE" }
          Write-Output "PACKAGE_INVENTORY_MANIFEST=$manifest"
          Write-Output "OVERLAY_UPLOADED=NO"
      - name: Upload bounded package evidence
        uses: actions/upload-artifact@v4
        with:
          name: hive-native-packages-windows-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/hive-package-inventory.json

  package-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head and Linux runner identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
          echo "CANARY_PLATFORM=linux"
          uname -a
      - name: Install minimal Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-native-package-linux-v1
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Record pinned CLI and advertised bundle targets
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_CLI_VERSION=$(node -e "process.stdout.write(require('@tauri-apps/cli/package.json').version)")"
          npm run tauri -- bundle --help > "$RUNNER_TEMP/bundle-help.txt" 2>&1 || true
          VALUES="$(grep -o 'possible values:.*' "$RUNNER_TEMP/bundle-help.txt" | head -1)"
          echo "BUNDLE_VALUES=$VALUES"
          for target in appimage deb; do
            case "$VALUES" in
              *"$target"*) ;;
              *) echo "TARGET_NOT_ADVERTISED=$target"; exit 1 ;;
            esac
          done
      - name: Derive canonical version and identifier from Tauri config
        shell: bash
        run: |
          set -euo pipefail
          DRIFT="$(python tools/desktop/version_drift.py)"
          echo "$DRIFT"
          case "$DRIFT" in
            *"VERSION_DRIFT=LOCKED"*) ;;
            *) echo "VERSION_DRIFT_NOT_LOCKED"; exit 1 ;;
          esac
          VERSION="$(python -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")"
          IDENTIFIER="$(python -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['identifier'])")"
          test -n "$VERSION"
          test -n "$IDENTIFIER"
          echo "CANONICAL_CONFIG_SOURCE=apps/desktop/src-tauri/tauri.conf.json"
          echo "DERIVED_CANONICAL_VERSION=$VERSION"
          echo "DERIVED_CANONICAL_IDENTIFIER=$IDENTIFIER"
          { echo "CANONICAL_VERSION=$VERSION"; echo "CANONICAL_IDENTIFIER=$IDENTIFIER"; } >> "$GITHUB_ENV"

      - name: Native compile without bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle --features rfd/gtk3
      - name: Create ephemeral bundle overlay (runner-local, non-tracked)
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="$RUNNER_TEMP/hive-bundle-overlay.json"
          test -f apps/desktop/src-tauri/icons/icon.ico
          test -f apps/desktop/src-tauri/icons/icon.png
          printf '%s' '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' > "$OVERLAY"
          echo "OVERLAY_PATH=$OVERLAY"
          BEFORE="$(sha256sum apps/desktop/src-tauri/tauri.conf.json | cut -d' ' -f1)"
          echo "TAURI_CONF_SHA256_BEFORE=$BEFORE"
          echo "TAURI_CONF_BEFORE=$BEFORE" >> "$GITHUB_ENV"
      - name: Explicit bundle with ephemeral overlay
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          for attempt in 1 2; do
            echo "BUNDLE_ATTEMPT=$attempt"
            if npm run tauri -- bundle --bundles appimage,deb --ci --config "$RUNNER_TEMP/hive-bundle-overlay.json"; then
              echo "BUNDLE_RESULT=SUCCESS attempt=$attempt"
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "BUNDLE_RESULT=FAILED attempts=$attempt"
              exit 1
            fi
            echo "BUNDLE_RESULT=RETRY attempt=$attempt"
            sleep 15
          done
      - name: Guard tracked source and canonical config after bundling
        shell: bash
        run: |
          set -euo pipefail
          AFTER="$(sha256sum apps/desktop/src-tauri/tauri.conf.json | cut -d' ' -f1)"
          echo "TAURI_CONF_SHA256_AFTER=$AFTER"
          test "$AFTER" = "$TAURI_CONF_BEFORE"
          git diff --quiet --exit-code
          echo "TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Native structural checks (no install, no execution)
        shell: bash
        run: |
          set -euo pipefail
          root=apps/desktop/src-tauri/target/release/bundle
          appimage="$(find "$root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find "$root/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          echo "APPIMAGE_FORMAT=$(file -b "$appimage")"
          test -s "$appimage"
          test -x "$appimage" || { echo "APPIMAGE_NOT_EXECUTABLE"; exit 1; }
          echo "DEB_IDENTITY=$(dpkg-deb -f "$deb" Package) $(dpkg-deb -f "$deb" Version)"
          test "$(dpkg-deb -f "$deb" Version)" = "$CANONICAL_VERSION" || { echo "DEB_VERSION_MISMATCH"; exit 1; }
          echo "STRUCTURAL_CHECK_LINUX=PASS"
      - name: Deterministic package inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python tools/desktop/package_inventory.py \
            --package-root apps/desktop/src-tauri/target/release/bundle \
            --platform linux --architecture "$(uname -m)" \
            --source-sha "$SOURCE_SHA" --canonical-version "$CANONICAL_VERSION" \
            --expected-types appimage,deb --json-out "$RUNNER_TEMP/hive-package-inventory.json"
          echo "PACKAGE_INVENTORY_MANIFEST=$RUNNER_TEMP/hive-package-inventory.json"
          echo "OVERLAY_UPLOADED=NO"
      - name: Upload bounded package evidence
        uses: actions/upload-artifact@v4
        with:
          name: hive-native-packages-linux-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/hive-package-inventory.json

  package-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head and macOS runner identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
          echo "CANARY_PLATFORM=macos"
          sw_vers
          uname -m
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-native-package-macos-v1
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Record pinned CLI and advertised bundle targets
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_CLI_VERSION=$(node -e "process.stdout.write(require('@tauri-apps/cli/package.json').version)")"
          npm run tauri -- bundle --help > "$RUNNER_TEMP/bundle-help.txt" 2>&1 || true
          VALUES="$(grep -o 'possible values:.*' "$RUNNER_TEMP/bundle-help.txt" | head -1)"
          echo "BUNDLE_VALUES=$VALUES"
          for target in app dmg; do
            case "$VALUES" in
              *"$target"*) ;;
              *) echo "TARGET_NOT_ADVERTISED=$target"; exit 1 ;;
            esac
          done
      - name: Derive canonical version and identifier from Tauri config
        shell: bash
        run: |
          set -euo pipefail
          DRIFT="$(python3 tools/desktop/version_drift.py)"
          echo "$DRIFT"
          case "$DRIFT" in
            *"VERSION_DRIFT=LOCKED"*) ;;
            *) echo "VERSION_DRIFT_NOT_LOCKED"; exit 1 ;;
          esac
          VERSION="$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['version'])")"
          IDENTIFIER="$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json',encoding='utf-8'))['identifier'])")"
          test -n "$VERSION"
          test -n "$IDENTIFIER"
          echo "CANONICAL_CONFIG_SOURCE=apps/desktop/src-tauri/tauri.conf.json"
          echo "DERIVED_CANONICAL_VERSION=$VERSION"
          echo "DERIVED_CANONICAL_IDENTIFIER=$IDENTIFIER"
          { echo "CANONICAL_VERSION=$VERSION"; echo "CANONICAL_IDENTIFIER=$IDENTIFIER"; } >> "$GITHUB_ENV"

      - name: Native compile without bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Create ephemeral bundle overlay (runner-local, non-tracked)
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="$RUNNER_TEMP/hive-bundle-overlay.json"
          test -f apps/desktop/src-tauri/icons/icon.ico
          test -f apps/desktop/src-tauri/icons/icon.png
          printf '%s' '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' > "$OVERLAY"
          echo "OVERLAY_PATH=$OVERLAY"
          BEFORE="$(shasum -a 256 apps/desktop/src-tauri/tauri.conf.json | cut -d' ' -f1)"
          echo "TAURI_CONF_SHA256_BEFORE=$BEFORE"
          echo "TAURI_CONF_BEFORE=$BEFORE" >> "$GITHUB_ENV"
      - name: Explicit bundle with ephemeral overlay
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          for attempt in 1 2; do
            echo "BUNDLE_ATTEMPT=$attempt"
            if npm run tauri -- bundle --bundles app,dmg --ci --config "$RUNNER_TEMP/hive-bundle-overlay.json"; then
              echo "BUNDLE_RESULT=SUCCESS attempt=$attempt"
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "BUNDLE_RESULT=FAILED attempts=$attempt"
              exit 1
            fi
            echo "BUNDLE_RESULT=RETRY attempt=$attempt"
            sleep 15
          done
      - name: Guard tracked source and canonical config after bundling
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_CONF_SHA256_AFTER=$(shasum -a 256 apps/desktop/src-tauri/tauri.conf.json | cut -d' ' -f1)"
          git diff --quiet --exit-code
          echo "TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Native structural checks (no install, no signing)
        shell: bash
        run: |
          set -euo pipefail
          root=apps/desktop/src-tauri/target/release/bundle
          app_bundle="$(find "$root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_bundle"
          test -n "$dmg"
          echo "APP_BUNDLE=$app_bundle"
          plutil -p "$app_bundle/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleExecutable'
          test -x "$app_bundle/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app_bundle/Contents/Info.plist")" \
            || { echo "APP_EXECUTABLE_MISSING"; exit 1; }
          hdiutil verify "$dmg"
          echo "STRUCTURAL_CHECK_MACOS=PASS"
      - name: Deterministic package inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/desktop/package_inventory.py \
            --package-root apps/desktop/src-tauri/target/release/bundle \
            --platform macos --architecture "$(uname -m)" \
            --source-sha "$SOURCE_SHA" --canonical-version "$CANONICAL_VERSION" \
            --expected-types app,dmg --expected-identifier "$CANONICAL_IDENTIFIER" \
            --json-out "$RUNNER_TEMP/hive-package-inventory.json"
          echo "PACKAGE_INVENTORY_MANIFEST=$RUNNER_TEMP/hive-package-inventory.json"
          echo "OVERLAY_UPLOADED=NO"
      - name: Upload bounded package evidence
        uses: actions/upload-artifact@v4
        with:
          name: hive-native-packages-macos-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/hive-package-inventory.json
