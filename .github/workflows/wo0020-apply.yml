name: WO0020 guarded applier

on:
  push:
    branches:
      - feat/HCODER-WO-0020-desktop-runtime-status-supervisor-canonical
    paths:
      - .github/workflows/wo0020-apply.yml
      - tools/desktop/apply_wo0020.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/HCODER-WO-0020-desktop-runtime-status-supervisor-canonical
          fetch-depth: 0
      - name: Apply exact guarded patch
        run: python tools/desktop/apply_wo0020.py
      - name: Verify exact product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check -- apps/desktop/src-tauri/src/lib.rs tools/desktop/security_gate.py
          changed="$(git diff --name-only | sort)"
          expected=$'apps/desktop/src-tauri/src/lib.rs\ntools/desktop/security_gate.py'
          test "$changed" = "$expected" || { printf 'unexpected delta:\n%s\n' "$changed"; exit 1; }
          python tools/desktop/security_gate.py
      - name: Commit guarded patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/src/lib.rs tools/desktop/security_gate.py
          git commit -m "HCODER-WO-0020: wire fixed runtime status supervisor"
          git push origin HEAD:feat/HCODER-WO-0020-desktop-runtime-status-supervisor-canonical
