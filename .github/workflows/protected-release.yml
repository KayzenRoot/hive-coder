            if [ "$attempt" = "2" ]; then
              echo "BUNDLE_RESULT=FAILED attempts=$attempt"
              exit 1
            fi
            echo "BUNDLE_RESULT=RETRY attempt=$attempt"
            sleep 15
          done
      - name: Guard tracked source and canonical config after bundling
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_CONF_SHA256_AFTER=$(shasum -a 256 "$TAURI_CONFIG" | cut -d' ' -f1)"
          test "$(shasum -a 256 "$TAURI_CONFIG" | cut -d' ' -f1)" = "$TAURI_CONF_BEFORE"
          git diff --quiet --exit-code
          echo "TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Native structural checks (no install, no signing)
        shell: bash
        run: |
          set -euo pipefail
          root="$PACKAGE_ROOT"
          app_bundle="$(find "$root/macos" -maxdepth 1 -name '*.app' -print -quit)"
          dmg="$(find "$root/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_bundle"
          test -n "$dmg"
          plutil -p "$app_bundle/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString|CFBundleExecutable'
          test -x "$app_bundle/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$app_bundle/Contents/Info.plist")" \
            || { echo "APP_EXECUTABLE_MISSING"; exit 1; }
          hdiutil verify "$dmg"
          echo "STRUCTURAL_CHECK_MACOS=PASS"
      - name: Deterministic package inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" tools/desktop/package_inventory.py \
            --package-root "$PACKAGE_ROOT" \
            --platform macos --architecture "$(uname -m)" \
            --source-sha "$SOURCE_SHA" --canonical-version "$CANONICAL_VERSION" \
            --expected-types app,dmg --expected-identifier "$CANONICAL_IDENTIFIER" \
            --json-out "$RUNNER_TEMP/hive-package-inventory.json" > /dev/null
          test -s "$RUNNER_TEMP/hive-package-inventory.json"
          echo "PACKAGE_INVENTORY_MANIFEST=$RUNNER_TEMP/hive-package-inventory.json" >> "$GITHUB_ENV"
          echo "OVERLAY_UPLOADED=NO"
      - name: Prove the bound inventory bytes are canonical
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import canonical_bytes

          raw = pathlib.Path(os.environ["PACKAGE_INVENTORY_MANIFEST"]).read_bytes()
          canonical = canonical_bytes(json.loads(raw))
          if raw != canonical:
              raise SystemExit("INVENTORY_BYTES_ARE_NOT_CANONICAL")
          print("INVENTORY_BYTES_ARE_CANONICAL=PASS")
          PY
      - name: Build credential-free provenance baseline
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m tools.desktop.release_provenance --build \
            --inventory "$PACKAGE_INVENTORY_MANIFEST" --release-channel "$RELEASE_CHANNEL" \
            --json-out "$RUNNER_TEMP/hive-release-provenance-baseline.json" > /dev/null
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-baseline.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
          echo "PROVENANCE_BASELINE=$RUNNER_TEMP/hive-release-provenance-baseline.json" >> "$GITHUB_ENV"
      # actions/attest@v4.2.2 — macOS provenance is not platform trust. Nothing in
      # this lane runs codesign or notarytool, and the gate below proves that a
      # verified attestation clears neither requirement. The `.app` is a directory
      # bundle, so it is attested under the sorted-tree identity the inventory already
      # recorded for it; the subject-set proof states that kind per subject instead of
      # letting a tree digest be read downstream as a file hash.
      - name: Derive the attestation subjects from the validated inventory
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT_NAME="$("$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import attestation_subjects, render_attestation_checksums

          manifest = pathlib.Path(os.environ["PACKAGE_INVENTORY_MANIFEST"])
          inventory = json.loads(manifest.read_text(encoding="utf-8"))
          subjects = attestation_subjects(inventory)
          checksums = pathlib.Path(os.environ["RUNNER_TEMP"], "hive-attestation-subjects.txt")
          checksums.write_text(render_attestation_checksums(inventory), encoding="utf-8", newline="\n")
          print(f"ATTESTATION_SUBJECT_COUNT={len(subjects)}", file=sys.stderr)
          for subject in subjects:
              print(f"ATTESTATION_SUBJECT={subject['name']} identity={subject['identityKind']}", file=sys.stderr)
          print(next(subject["name"] for subject in subjects if subject["identityKind"] == "file-bytes"))
          PY
          )"
          echo "ATTESTATION_SUBJECTS_FILE=$RUNNER_TEMP/hive-attestation-subjects.txt" >> "$GITHUB_ENV"
          echo "ATTESTATION_VERIFY_TARGET=$PACKAGE_ROOT/$SUBJECT_NAME" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/hive-attestation-subjects.txt"
      - name: Attest the release packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/hive-attestation-subjects.txt
      - name: Independently verify the attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_REF: ${{ github.ref }}
          SIGNER_IDENTITY: ${{ format('{0}@{1}', github.repository, github.ref) }}
          SIGNER_WORKFLOW_ID: ${{ github.repository }}/.github/workflows/protected-release.yml
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          set -euo pipefail
          # The bundle path is handed straight to the verifier. On a Windows runner it
          # is a native path, and copying it through cp/test -s is how lanes break there.
          # The target is one of the attested packages, not the manifest: the verifier
          # matches a supplied file against the statement by digest alone, so this step
          # proves the signature, the transparency record and the identity policy, and
          # says nothing about the other subjects. The next step proves the whole set.
          gh attestation verify "$ATTESTATION_VERIFY_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE" \
            --signer-repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER_WORKFLOW_ID" \
            --source-ref "$SOURCE_REF" --deny-self-hosted-runners
          echo "ATTESTATION_VERIFICATION=PASSED"
          echo "ATTESTATION_ID=$ATTESTATION_ID"
          echo "SIGNER_IDENTITY=$SIGNER_IDENTITY" >> "$GITHUB_ENV"
          echo "ATTESTATION_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Prove the attestation subjects are exactly this release's packages
        shell: bash
        run: |
          set -euo pipefail
          # The verifier above matched one artifact against the statement by digest and
          # said nothing about the rest of the set, so the bundle is decoded and compared
          # here: a statement missing a package, carrying one the inventory never
          # recorded, or signed over something other than build provenance fails this
          # step instead of passing unnoticed.
          "$PYTHON_BIN" -m tools.desktop.release_provenance --attest-subjects \
            --attest-bundle "$ATTESTATION_BUNDLE" --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Record the attestation as generated, proving the advance is legal
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import hashlib, json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import serialize_provenance

          temp = os.environ["RUNNER_TEMP"]
          document = json.loads(pathlib.Path(f"{temp}/hive-release-provenance-baseline.json").read_text(encoding="utf-8"))
          bundle = pathlib.Path(os.environ["ATTESTATION_BUNDLE"]).read_bytes()
          document["attestation"] = {
              "status": "generated",
              "verification": "none",
              "signerWorkflow": os.environ["SIGNER_IDENTITY"],
              "sourceRef": os.environ["SOURCE_REF"],
              "runId": int(os.environ["RUN_ID"]),
              "bundleDigest": hashlib.sha256(bundle).hexdigest(),
          }
          pathlib.Path(f"{temp}/hive-release-provenance-attested.json").write_text(
              serialize_provenance(document), encoding="utf-8"
          )
          PY
          "$PYTHON_BIN" -m tools.desktop.release_provenance --transition \
            --before "$PROVENANCE_BASELINE" --after "$RUNNER_TEMP/hive-release-provenance-attested.json"
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-attested.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Record the passed verification, proving the advance is legal
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import serialize_provenance

          temp = os.environ["RUNNER_TEMP"]
          document = json.loads(pathlib.Path(f"{temp}/hive-release-provenance-attested.json").read_text(encoding="utf-8"))
          attestation = document["attestation"]
          if attestation["status"] != "generated":
              raise SystemExit("REFUSING_TO_RECORD_VERIFICATION_OVER_A_HELD_STATE")
          attestation["status"] = "verified"
          attestation["verification"] = "passed"
          pathlib.Path(f"{temp}/hive-release-provenance-verified.json").write_text(
              serialize_provenance(document), encoding="utf-8"
          )
          PY
          "$PYTHON_BIN" -m tools.desktop.release_provenance --transition \
            --before "$RUNNER_TEMP/hive-release-provenance-attested.json" \
            --after "$RUNNER_TEMP/hive-release-provenance-verified.json"
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-verified.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Admission gate must refuse for want of publisher signing and notarization
        shell: bash
        run: |
          set -euo pipefail
          out="$("$PYTHON_BIN" -m tools.desktop.release_provenance --gate \
            --provenance "$RUNNER_TEMP/hive-release-provenance-verified.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST" || true)"
          echo "$out"
          echo "$out" | grep -qx "RELEASE_GATE=DENY"
          for reason in publisher-signing-unverified:app publisher-signing-unverified:dmg \
            platform-trust-unverified:app platform-trust-unverified:dmg; do
            echo "$out" | grep -qx "REASON=$reason" || { echo "MISSING_REQUIRED_REFUSAL=$reason"; exit 1; }
          done
          if echo "$out" | grep -q "build-provenance-attestation-unverified"; then
            echo "VERIFIED_ATTESTATION_DID_NOT_CLEAR_PROVENANCE"; exit 1
          fi
          echo "SEPARATION_PROOF=PLATFORM_TRUST_AND_PUBLISHER_SIGNING_ARE_SEPARATE_REQUIREMENTS"
      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-release-evidence-macos-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/macos/*.app
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            ${{ runner.temp }}/hive-package-inventory.json
            ${{ runner.temp }}/hive-release-provenance-baseline.json
            ${{ runner.temp }}/hive-release-provenance-attested.json
            ${{ runner.temp }}/hive-release-provenance-verified.json

  # ---------------------------------------------------------------------------
  # Publisher signing stages. Each is isolated per operating system, so no macOS
  # credential is ever reachable from a Windows runner or the reverse. Each is
  # bound to the environment whose protection was objectively probed above, holds
  # read-only contents permission, and reaches no vendor tool: the signing
  # operation itself is not implemented in this increment, and the last step says
  # so by failing. That failure is deliberately independent of whether the
  # requirement has been provisioned, so a provisioned credential can never be
  # mistaken for a completed signature. Neither stage resolves a signing slot at
  # all: the requirement is printed as literal text, which is what keeps the
  # no-value-read claim true after provisioning rather than only before it.
  #
  # Linux has no stage here by design: its package formats offer no enforceable
  # publisher-trust model at install time, so inventing one would be a fabricated
  # guarantee rather than a missing one.
  # ---------------------------------------------------------------------------
  sign-windows:
    if: github.event_name == 'workflow_dispatch' && needs.probe-release-protection.outputs.proven == 'true'
    needs: [probe-release-protection, build-attest-windows]
    runs-on: windows-latest
    timeout-minutes: 20
    environment: hive-release-signing
    permissions:
      contents: read
    steps:
      - name: Re-assert the objective environment verdict
        shell: bash
        env:
          PROVEN: ${{ needs.probe-release-protection.outputs.proven }}
        run: |
          set -euo pipefail
          test "$PROVEN" = "true"
          echo "ENVIRONMENT_PROTECTION_PROVEN=true"
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # actions/download-artifact@v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hive-release-evidence-windows-${{ github.sha }}
          path: release-evidence
      - name: Re-verify the handed-over provenance before touching any credential
        shell: bash
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          python -m tools.desktop.release_provenance --verify \
            --provenance release-evidence/hive-release-provenance-verified.json \
            --inventory release-evidence/hive-package-inventory.json
          python -m tools.desktop.release_provenance --transition \
            --before release-evidence/hive-release-provenance-baseline.json \
            --after release-evidence/hive-release-provenance-verified.json
      # Requirement reporting. This substrate has no credential-read authority, so the
      # requirement is declared as literal text: nothing here is an expression, an
      # environment binding or a presence test, so no value is resolved even after
      # someone provisions one. A binding plus a probe would read a real credential the
      # moment provisioning existed, which is the difference between "no secrets today"
      # and "structurally unable to resolve one here".
      - name: Report the signing requirement without resolving any slot
        shell: bash
        run: |
          set -euo pipefail
          echo "SLOT_REQUIRED=AZURE_ARTIFACT_SIGNING_ENDPOINT"
          echo "SLOT_REQUIRED=AZURE_ARTIFACT_SIGNING_ACCOUNT"
          echo "SLOT_REQUIRED=AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE"
          echo "CONFIG_IDENTITY_REQUIRED=ENTRA_APPLICATION_CLIENT_ID"
          echo "CONFIG_IDENTITY_REQUIRED=ENTRA_DIRECTORY_TENANT_ID"
          echo "CONFIG_IDENTITY_REQUIRED=ARTIFACT_SIGNING_SUBSCRIPTION_ID"
          echo "CONFIG_IDENTITY_REQUIRED=FEDERATED_CREDENTIAL_SUBJECT_REPO_ENVIRONMENT_IDENTITY"
          echo "CONFIG_IDENTITY_REQUIRED=CERTIFICATE_PROFILE_SIGNER_ROLE_ASSIGNMENT"
          echo "CREDENTIAL_CLASS=Azure Artifact Signing certificate profile reached by a federated Microsoft Entra identity; the private key never exists on the runner and the five entries above are configuration identities, not secret values"
          echo "CREDENTIAL_MECHANISM=federated credential trusting this repository and release environment, role assigned at certificate-profile scope, short-lived OIDC token exchanged per signing operation"
          echo "VERIFICATION_CONDITION=each package's signature verifies with an independent authenticode verification whose signer identity matches the recorded certificate subject and fingerprint"
          echo "VALUES_RESOLVED=NOTHING VALUES_READ=NO VALUES_PRINTED=NO VALUES_PERSISTED=NO"
      - name: Refuse to present an unsigned stage as a signed one
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_SUBSTRATE_STOPPED=BLOCKED_EXTERNAL_CREDENTIALS_AND_UNIMPLEMENTED_SIGNING"
          echo "This increment implements no Windows signing operation. Succeeding here"
          echo "without one would assert publisher authenticity that nothing produced, so"
          echo "the stage fails regardless of whether the requirement above is provisioned."
          exit 1

  sign-and-notarize-macos:
    if: github.event_name == 'workflow_dispatch' && needs.probe-release-protection.outputs.proven == 'true'
    needs: [probe-release-protection, build-attest-macos]
    runs-on: macos-latest
    timeout-minutes: 20
    environment: hive-release-signing
    permissions:
      contents: read
    steps:
      - name: Re-assert the objective environment verdict
        shell: bash
        env:
          PROVEN: ${{ needs.probe-release-protection.outputs.proven }}
        run: |
          set -euo pipefail
          test "$PROVEN" = "true"
          echo "ENVIRONMENT_PROTECTION_PROVEN=true"
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # actions/download-artifact@v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hive-release-evidence-macos-${{ github.sha }}
          path: release-evidence
      - name: Re-verify the handed-over provenance before touching any credential
        shell: bash
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          python3 -m tools.desktop.release_provenance --verify \
            --provenance release-evidence/hive-release-provenance-verified.json \
            --inventory release-evidence/hive-package-inventory.json
          python3 -m tools.desktop.release_provenance --transition \
            --before release-evidence/hive-release-provenance-baseline.json \
            --after release-evidence/hive-release-provenance-verified.json
      # Same law as the Windows stage: the requirement is declared, never evaluated. The
      # notarization mechanism selected by DEC-030 is an App Store Connect API key, whose
      # three inputs are two identifiers and a key file path, so the developer Team ID is
      # not on this list: it authenticates the Apple-ID flow, and substituting it for the
      # issuer would produce a submission that cannot be authorized.
      - name: Report the signing and notarization requirement without resolving any slot
        shell: bash
        run: |
          set -euo pipefail
          echo "SLOT_REQUIRED=APPLE_SIGNING_IDENTITY"
          echo "SLOT_REQUIRED=APPLE_CERTIFICATE"
          echo "SLOT_REQUIRED=APPLE_CERTIFICATE_PASSWORD"
          echo "SLOT_REQUIRED=APPLE_API_KEY"
          echo "SLOT_REQUIRED=APPLE_API_ISSUER"
          echo "SLOT_REQUIRED=APPLE_API_KEY_PATH"
          echo "CREDENTIAL_CLASS=Apple Developer ID Application certificate for publisher signing plus an App Store Connect team API key for notarytool platform trust; the certificate private key and the .p8 key material stay external, and Tauri reads the .p8 by path rather than by value"
          echo "CREDENTIAL_MECHANISM=codesign with Hardened Runtime and an RFC 3161 timestamp, then notarytool submit over the API-key authentication triple: APPLE_API_KEY is the Key ID, APPLE_API_ISSUER is the App Store Connect issuer UUID and APPLE_API_KEY_PATH is the path to the .p8 file, then staple the ticket"
          echo "NON_SUBSTITUTABLE=APPLE_TEAM_ID authenticates the Apple-ID notarization mode and is not the App Store Connect issuer, so it satisfies neither APPLE_API_ISSUER nor APPLE_API_KEY"
          echo "VERIFICATION_CONDITION=codesign --verify --strict --deep passes and xcrun notarytool information reports Acceptance for the submitted artifact"
          echo "VALUES_RESOLVED=NOTHING VALUES_READ=NO VALUES_PRINTED=NO VALUES_PERSISTED=NO"
      - name: Refuse to present an unsigned stage as a signed or notarized one
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_SUBSTRATE_STOPPED=BLOCKED_EXTERNAL_CREDENTIALS_AND_UNIMPLEMENTED_SIGNING"
          echo "Publisher signing and platform trust are two separate requirements and"
          echo "neither is produced by this increment, so the stage fails regardless of"
          echo "whether the requirement above is provisioned."
          exit 1

  # Publication is its own act, behind its own environment and its own explicit
  # opt-in, and it re-derives its decision from evidence rather than trusting the
  # jobs it depends on. Reaching `gh release create` today is structurally
  # impossible: the signing stages above fail, and even were they removed the gate
  # checks refuse any document whose publisher signing is unverified.
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_intended == 'true' &&
      needs.probe-release-protection.outputs.proven == 'true'
    needs:
      - probe-release-protection
      - build-attest-windows
      - build-attest-linux
      - build-attest-macos
      - sign-windows
      - sign-and-notarize-macos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hive-release-publish
    permissions:
      contents: write
    steps:
      - name: Re-assert the objective environment verdict
        shell: bash
        env:
          PROVEN: ${{ needs.probe-release-protection.outputs.proven }}
        run: |
          set -euo pipefail
          test "$PROVEN" = "true"
          echo "ENVIRONMENT_PROTECTION_PROVEN=true"
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
      # actions/download-artifact@v4.3.0
      - name: Collect per-platform release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hive-release-evidence-*-${{ github.sha }}
          path: release-evidence
          merge-multiple: false
      - name: Publication requires an objectively admissible document per platform
        shell: bash
        env:
          PYTHONWARNINGS: error::ResourceWarning
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          for platform in windows linux macos; do
            dir="release-evidence/hive-release-evidence-$platform-${GITHUB_SHA}"
            test -d "$dir" || { echo "EVIDENCE_MISSING=$platform"; exit 1; }
            python3 -m tools.desktop.release_provenance --verify \
              --provenance "$dir/hive-release-provenance-verified.json" \
              --inventory "$dir/hive-package-inventory.json"
            python3 -m tools.desktop.release_provenance --gate \
              --provenance "$dir/hive-release-provenance-verified.json" \
              --inventory "$dir/hive-package-inventory.json"
          done
          python3 -m tools.desktop.release_provenance --channel-gate --release-channel "$RELEASE_CHANNEL"
      - name: Refuse publication without implemented signing authority
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_SUBSTRATE_STOPPED=BLOCKED_EXTERNAL_CREDENTIALS_AND_UNIMPLEMENTED_SIGNING"
          echo "No artifact this lane can produce carries publisher authenticity, so"
          echo "nothing may be published from it. The gate step above is the objective"
          echo "refusal; this step is the explicit statement of it."
          exit 1
      # Unreachable today: it can only run after the gate above is satisfied by real
      # signing, and a protected tag must already exist for the release to point at.
      - name: Create the protected release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(python3 -c "import json;print(json.load(open('$TAURI_CONFIG',encoding='utf-8'))['version'])")"
          TAG="v$VERSION"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "PROTECTED_TAG_ABSENT=$TAG"; exit 1; }
          gh release create "$TAG" --verify-tag --title "Hive Coder $TAG" --notes "Release provenance is recorded in the hive-release-provenance-v1 documents attached to this run."
