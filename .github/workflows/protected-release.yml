name: Protected Release

# Secret-independent release substrate for HCODER-WO-0026 / DEC-030.
#
# What this lane proves today: a release-provenance document can be generated from
# real CP-0025 packaging evidence, bound to it, attested, independently verified, and
# then judged by an admission gate that refuses publication wherever a guarantee is
# missing. Nothing here signs, notarizes or publishes anything.
#
# What this lane must never do: treat a provenance attestation as publisher
# authenticity, or treat a digest as either one. Integrity, upstream binding, build
# provenance, publisher authenticity and platform trust — plus publication — are
# separate fields of `hive-release-provenance-v1` with separate admission rules, and
# the final steps of every build lane below re-prove that separation against the real
# artifacts instead of asserting it in prose.
#
# Trigger law: like the sibling lanes, this file carries NO `pull_request` path
# filter, because a correction that touches only governance still moves the promotion
# head and that head must receive evidence. Only `preflight` and
# `probe-release-protection` run there, and both are structurally incapable of
# holding a credential: the probe reads an unauthenticated public HTTP endpoint with
# no token at all. Every credential-bearing and publication stage is gated on an
# explicit `workflow_dispatch`, so no pull-request code path can reach a signing
# identity, an OIDC mint or `contents: write`. There is deliberately no
# `pull_request_target` and no `workflow_run`.
#
# Deliberate deviation from the prevailing mutable-tag action pinning: every action
# used here is pinned to a full commit SHA, including in `preflight`, because the
# promotion-path jobs run with release authority and a tag is re-pointable by the
# upstream repository. Each pin records the upstream release identity it resolves to,
# so the substitution stays auditable. This is stricter than the sibling lanes, which
# are not modified.
#
# The signing and notarization stages exist, are environment-bound, permission-scoped
# and dependency-gated — and they stop at a barrier that fails regardless of whether
# credentials have since been provisioned. A signing stage that went green without
# executing a signature would fabricate publisher authenticity, which is the exact
# defect DEC-030 exists to prevent. Provisioning material does not turn those stages
# green; a further governed increment that implements and exercises the signing
# operation does.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_channel:
        description: Channel to admit the canonical version against (hive-release-channel-v1)
        type: choice
        required: true
        default: stable
        options:
          - stable
          - beta
          - dev
      publish_intended:
        description: Allow the separately gated publication stage to be considered at all
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  ARTIFACT_RETENTION_DAYS: "7"
  CANONICAL_NODE_VERSION: "24.21.0"
  CANONICAL_RUST_TOOLCHAIN: "1.98.1"
  TAURI_CONFIG: apps/desktop/src-tauri/tauri.conf.json
  PACKAGE_ROOT: apps/desktop/src-tauri/target/release/bundle
  RELEASE_ENVIRONMENT: hive-release-signing
  PUBLISH_ENVIRONMENT: hive-release-publish
  ENVIRONMENT_API: https://api.github.com/repos

jobs:
  # Cheap, credential-free, and runs on every promotion head. This is the exact-head
  # gate for the release law itself: the validator, its adversarial suite, the
  # workflow policy audit and the version and channel gates all execute here.
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
      - name: Establish interpreter identity
        run: python3 --version
      - name: Compile the release substrate
        run: python3 -m compileall -q tools/desktop/release_provenance.py tools/desktop/package_inventory.py tools/desktop/version_drift.py
      - name: Release substrate suite (offline, fail-closed)
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          set -euo pipefail
          python3 -m unittest -q \
            tests.desktop.test_release_provenance \
            tests.desktop.test_package_inventory \
            tests.desktop.test_version_drift \
            tests.desktop.test_protected_release_workflow
      - name: Canonical version drift gate
        run: |
          set -euo pipefail
          python3 tools/desktop/version_drift.py | tee "$RUNNER_TEMP/version-drift.txt"
          grep -q "VERSION_DRIFT=LOCKED" "$RUNNER_TEMP/version-drift.txt"
      - name: Channel admission
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "CHANNEL_DECISION=DEFERRED_TO_PROMOTION"
            echo "A pull request names no release channel; only a promotion dispatch does."
            exit 0
          fi
          python3 -m tools.desktop.release_provenance --channel-gate --release-channel "$RELEASE_CHANNEL"

  # Objective proof of what the named environments actually are. Naming an environment
  # in YAML is not evidence of protection: a platform creates a missing environment
  # rather than failing, and rules an administrator may bypass are not a gate. The
  # record is fetched over an unauthenticated public endpoint and judged by the
  # validator's `--environment-protection` mode, so this job holds no credential,
  # cannot leak one, and does not encode the admission rule in shell.
  probe-release-protection:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      proven: ${{ steps.assess.outputs.proven }}
    steps:
      # actions/checkout@v7.0.1 — the admission rule lives in the validator, so this
      # job needs the source it judges the rule by. It still holds no credential.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch environment records without a credential
        shell: bash
        run: |
          set -euo pipefail
          echo "PROBE_MODE=unauthenticated-public-read"
          echo "PROBE_TOKEN_PRESENT=NO"
          echo "PROBE_CREDENTIAL_READ=NO"
          for name in "$RELEASE_ENVIRONMENT" "$PUBLISH_ENVIRONMENT"; do
            status="$(curl -sS -o "$RUNNER_TEMP/env-$name.json" -w '%{http_code}' \
              "$ENVIRONMENT_API/$GITHUB_REPOSITORY/environments/$name" \
              -H 'Accept: application/vnd.github+json')"
            echo "ENVIRONMENT=$name HTTP_STATUS=$status"
            case "$status" in
              200) ;;
              404)
                # An absent environment is the most common way a "protected" release
                # path is in fact unprotected, so it is recorded as such and judged.
                printf '{\n  "name": "%s",\n  "can_admins_bypass": true,\n  "protection_rules": []\n}\n' \
                  "$name" > "$RUNNER_TEMP/env-$name.json"
                echo "ENVIRONMENT_ABSENT=$name"
                ;;
              *) echo "PROBE_INCONCLUSIVE=HTTP $status is neither a record nor an absence"; exit 1 ;;
            esac
          done
      - name: Judge the fetched records into one verdict
        id: assess
        shell: bash
        run: |
          set -euo pipefail
          proven=true
          for name in "$RELEASE_ENVIRONMENT" "$PUBLISH_ENVIRONMENT"; do
            if ! python3 -m tools.desktop.release_provenance --environment-protection \
              --environment-record "$RUNNER_TEMP/env-$name.json" --environment-name "$name"; then
              proven=false
            fi
          done
          echo "proven=$proven" >> "$GITHUB_OUTPUT"
          echo "PROTECTION_PROVEN=$proven"
          echo "YAML_INTENT_COUNTS_AS_EVIDENCE=NO"
      - name: Promotion path refuses to continue behind an unproven gate
        if: github.event_name == 'workflow_dispatch' && steps.assess.outputs.proven != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "RELEASE_SUBSTRATE_STOPPED=BLOCKED_PROTECTED_ENVIRONMENT"
          echo "Required, for each of $RELEASE_ENVIRONMENT and $PUBLISH_ENVIRONMENT:"
          echo "  * the environment exists"
          echo "  * a required_reviewers protection rule names at least one reviewer"
          echo "  * prevent_self_review is enabled on that rule"
          echo "  * can_admins_bypass is disabled"
          echo "No credential value is read, requested or reported by this lane."
          exit 1
      - name: Non-promotion events report the finding without claiming protection
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          PROVEN: ${{ steps.assess.outputs.proven }}
        run: |
          set -euo pipefail
          echo "PROTECTION_CLAIMED=NO"
          echo "PROTECTION_PROVEN=$PROVEN"
          echo "This run starts no credential-bearing job, so an unproven gate is evidence, not a failure."

  # ---------------------------------------------------------------------------
  # Build, inventory, attest and verify. No signing credential is reachable from
  # these jobs: `id-token` mints a short-lived OIDC identity for the attestation
  # service only, and that identity is never handed to a signing or publication
  # stage. The three lanes are repeated per operating system on purpose — that is
  # this repository's established workflow style, a matrix would hide which
  # platform's evidence disappeared, and the six-target CP-0025 matrix is not
  # reduced anywhere here: each lane still produces every target its platform
  # produces in Native Package Matrix.
  # ---------------------------------------------------------------------------
  build-attest-windows:
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, probe-release-protection]
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHON_BIN: python
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Re-assert the objective environment verdict
        shell: bash
        env:
          PROVEN: ${{ needs.probe-release-protection.outputs.proven }}
        run: |
          set -euo pipefail
          test "$PROVEN" = "true"
          echo "ENVIRONMENT_PROTECTION_PROVEN=true"
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
          Write-Output "CANARY_PLATFORM=windows"
      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.CANONICAL_NODE_VERSION }}
      # actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: ${{ env.CANONICAL_RUST_TOOLCHAIN }}
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-protected-release-windows-v1
      - name: Generate deterministic Hive desktop icon
        run: python tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Record pinned CLI and advertised bundle targets
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $cli = (node -e "process.stdout.write(require('@tauri-apps/cli/package.json').version)")
          Write-Output "TAURI_CLI_VERSION=$cli"
          $help = (npm run tauri -- bundle --help 2>&1 | Out-String)
          $values = ($help -split "`n" | Select-String -Pattern 'possible values:' | Select-Object -First 1)
          Write-Output "BUNDLE_VALUES=$values"
          foreach ($target in @('msi', 'nsis')) {
            if ($values -notmatch $target) { throw "TARGET_NOT_ADVERTISED=$target" }
          }
      - name: Derive canonical version and identifier from Tauri config
        shell: pwsh
        run: |
          $drift = (python tools/desktop/version_drift.py | Out-String)
          Write-Output $drift.Trim()
          if ($LASTEXITCODE -ne 0 -or $drift -notmatch "VERSION_DRIFT=LOCKED") { throw "version drift gate is not LOCKED" }
          $config = Get-Content $env:TAURI_CONFIG -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($config.version)) { throw "canonical version missing from Tauri config" }
          if ([string]::IsNullOrWhiteSpace($config.identifier)) { throw "canonical identifier missing from Tauri config" }
          "CANONICAL_VERSION=$($config.version)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          "CANONICAL_IDENTIFIER=$($config.identifier)" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
          Write-Output "CANONICAL_CONFIG_SOURCE=$env:TAURI_CONFIG"
      - name: Native compile without bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle
      - name: Create ephemeral bundle overlay (runner-local, non-tracked)
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP "hive-bundle-overlay.json"
          $iconIco = Join-Path $PWD "apps\desktop\src-tauri\icons\icon.ico"
          $iconPng = Join-Path $PWD "apps\desktop\src-tauri\icons\icon.png"
          foreach ($icon in @($iconIco, $iconPng)) {
            if (-not (Test-Path $icon)) { throw "generated icon missing: $icon" }
          }
          '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' | Set-Content -NoNewline -Encoding ascii $overlay
          Write-Output "OVERLAY_PATH=$overlay"
          $before = (Get-FileHash $env:TAURI_CONFIG -Algorithm SHA256).Hash
          "TAURI_CONF_BEFORE=$before" | Out-File -Append -Encoding ascii $env:GITHUB_ENV
      - name: Explicit bundle with ephemeral overlay
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $overlay = Join-Path $env:RUNNER_TEMP "hive-bundle-overlay.json"
          Remove-Item -Recurse -Force src-tauri\target\release\bundle -ErrorAction SilentlyContinue
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            Write-Output "BUNDLE_ATTEMPT=$attempt"
            npm run tauri -- bundle --bundles msi,nsis --ci --config $overlay
            if ($LASTEXITCODE -eq 0) { Write-Output "BUNDLE_RESULT=SUCCESS attempt=$attempt"; break }
            if ($attempt -eq 2) { throw "bundle step failed after $attempt attempts: $LASTEXITCODE" }
            Write-Output "BUNDLE_RESULT=RETRY attempt=$attempt"
            Start-Sleep -Seconds 15
          }
      - name: Guard tracked source and canonical config after bundling
        shell: pwsh
        run: |
          $after = (Get-FileHash $env:TAURI_CONFIG -Algorithm SHA256).Hash
          if ($after -ne $env:TAURI_CONF_BEFORE) { throw "canonical tauri.conf.json changed during packaging" }
          git diff --quiet --exit-code
          if ($LASTEXITCODE -ne 0) { throw "tracked source changed during packaging" }
          Write-Output "TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Native structural checks (no install, no execution)
        shell: pwsh
        run: |
          $root = Join-Path $PWD "apps\desktop\src-tauri\target\release\bundle"
          $msi = Get-ChildItem -Path (Join-Path $root 'msi') -Filter *.msi | Select-Object -First 1
          $nsis = Get-ChildItem -Path (Join-Path $root 'nsis') -Filter *.exe | Select-Object -First 1
          if (-not $msi) { throw "msi artifact missing" }
          if (-not $nsis) { throw "nsis artifact missing" }
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase','InvokeMethod',$null,$installer,@($msi.FullName,0))
          $view = $db.GetType().InvokeMember('OpenView','InvokeMethod',$null,$db,@("SELECT Value FROM Property WHERE Property='ProductVersion'"))
          $view.GetType().InvokeMember('Execute','InvokeMethod',$null,$view,$null)
          $record = $view.GetType().InvokeMember('Fetch','InvokeMethod',$null,$view,$null)
          $version = $record.GetType().InvokeMember('StringData','GetProperty',$null,$record,1)
          if ($version -ne $env:CANONICAL_VERSION) { throw "msi version mismatch: $version" }
          $stream = [System.IO.File]::OpenRead($nsis.FullName)
          try { $head = New-Object byte[] 2; [void]$stream.Read($head,0,2) } finally { $stream.Close() }
          if ($head[0] -ne 0x4D -or $head[1] -ne 0x5A) { throw "nsis artifact is not a PE image" }
          Write-Output "STRUCTURAL_CHECK_WINDOWS=PASS"
      - name: Deterministic package inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" tools/desktop/package_inventory.py \
            --package-root "$PACKAGE_ROOT" \
            --platform windows --architecture x86_64 \
            --source-sha "$SOURCE_SHA" --canonical-version "$CANONICAL_VERSION" \
            --expected-types msi,nsis --json-out "$RUNNER_TEMP/hive-package-inventory.json" > /dev/null
          test -s "$RUNNER_TEMP/hive-package-inventory.json"
          echo "PACKAGE_INVENTORY_MANIFEST=$RUNNER_TEMP/hive-package-inventory.json" >> "$GITHUB_ENV"
          echo "OVERLAY_UPLOADED=NO"
      - name: Prove the bound inventory bytes are canonical
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import canonical_bytes

          raw = pathlib.Path(os.environ["PACKAGE_INVENTORY_MANIFEST"]).read_bytes()
          canonical = canonical_bytes(json.loads(raw))
          if raw != canonical:
              raise SystemExit("INVENTORY_BYTES_ARE_NOT_CANONICAL")
          print("INVENTORY_BYTES_ARE_CANONICAL=PASS")
          PY
      - name: Build credential-free provenance baseline
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m tools.desktop.release_provenance --build \
            --inventory "$PACKAGE_INVENTORY_MANIFEST" --release-channel "$RELEASE_CHANNEL" \
            --json-out "$RUNNER_TEMP/hive-release-provenance-baseline.json" > /dev/null
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-baseline.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
          echo "PROVENANCE_BASELINE=$RUNNER_TEMP/hive-release-provenance-baseline.json" >> "$GITHUB_ENV"
      # actions/attest@v4.2.2 — build provenance over the native packages themselves.
      # The subject set is derived from the validated inventory rather than rediscovered
      # from the filesystem, so the attested identities are exactly the CP-0025 package
      # identities and no rival packaging model exists. This proves nothing about
      # publisher authenticity, and the next steps refuse to let it be read that way.
      - name: Derive the attestation subjects from the validated inventory
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT_NAME="$("$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import attestation_subjects, render_attestation_checksums

          manifest = pathlib.Path(os.environ["PACKAGE_INVENTORY_MANIFEST"])
          inventory = json.loads(manifest.read_text(encoding="utf-8"))
          subjects = attestation_subjects(inventory)
          checksums = pathlib.Path(os.environ["RUNNER_TEMP"], "hive-attestation-subjects.txt")
          checksums.write_text(render_attestation_checksums(inventory), encoding="utf-8", newline="\n")
          print(f"ATTESTATION_SUBJECT_COUNT={len(subjects)}", file=sys.stderr)
          for subject in subjects:
              print(f"ATTESTATION_SUBJECT={subject['name']} identity={subject['identityKind']}", file=sys.stderr)
          print(next(subject["name"] for subject in subjects if subject["identityKind"] == "file-bytes"))
          PY
          )"
          echo "ATTESTATION_SUBJECTS_FILE=$RUNNER_TEMP/hive-attestation-subjects.txt" >> "$GITHUB_ENV"
          echo "ATTESTATION_VERIFY_TARGET=$PACKAGE_ROOT/$SUBJECT_NAME" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/hive-attestation-subjects.txt"
      - name: Attest the release packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/hive-attestation-subjects.txt
      - name: Independently verify the attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_REF: ${{ github.ref }}
          SIGNER_IDENTITY: ${{ format('{0}@{1}', github.repository, github.ref) }}
          SIGNER_WORKFLOW_ID: ${{ github.repository }}/.github/workflows/protected-release.yml
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          set -euo pipefail
          # The bundle path is handed straight to the verifier. On a Windows runner it
          # is a native path, and copying it through cp/test -s is how lanes break there.
          # The target is one of the attested packages, not the manifest: the verifier
          # matches a supplied file against the statement by digest alone, so this step
          # proves the signature, the transparency record and the identity policy, and
          # says nothing about the other subjects. The next step proves the whole set.
          gh attestation verify "$ATTESTATION_VERIFY_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE" \
            --signer-repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER_WORKFLOW_ID" \
            --source-ref "$SOURCE_REF" --deny-self-hosted-runners
          echo "ATTESTATION_VERIFICATION=PASSED"
          echo "ATTESTATION_ID=$ATTESTATION_ID"
          echo "SIGNER_IDENTITY=$SIGNER_IDENTITY" >> "$GITHUB_ENV"
          echo "ATTESTATION_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Prove the attestation subjects are exactly this release's packages
        shell: bash
        run: |
          set -euo pipefail
          # The verifier above matched one artifact against the statement by digest and
          # said nothing about the rest of the set, so the bundle is decoded and compared
          # here: a statement missing a package, carrying one the inventory never
          # recorded, or signed over something other than build provenance fails this
          # step instead of passing unnoticed.
          "$PYTHON_BIN" -m tools.desktop.release_provenance --attest-subjects \
            --attest-bundle "$ATTESTATION_BUNDLE" --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Record the attestation as generated, proving the advance is legal
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import hashlib, json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import serialize_provenance

          temp = os.environ["RUNNER_TEMP"]
          document = json.loads(pathlib.Path(f"{temp}/hive-release-provenance-baseline.json").read_text(encoding="utf-8"))
          bundle = pathlib.Path(os.environ["ATTESTATION_BUNDLE"]).read_bytes()
          document["attestation"] = {
              "status": "generated",
              "verification": "none",
              "signerWorkflow": os.environ["SIGNER_IDENTITY"],
              "sourceRef": os.environ["SOURCE_REF"],
              "runId": int(os.environ["RUN_ID"]),
              "bundleDigest": hashlib.sha256(bundle).hexdigest(),
          }
          pathlib.Path(f"{temp}/hive-release-provenance-attested.json").write_text(
              serialize_provenance(document), encoding="utf-8"
          )
          PY
          "$PYTHON_BIN" -m tools.desktop.release_provenance --transition \
            --before "$PROVENANCE_BASELINE" --after "$RUNNER_TEMP/hive-release-provenance-attested.json"
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-attested.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Record the passed verification, proving the advance is legal
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import serialize_provenance

          temp = os.environ["RUNNER_TEMP"]
          document = json.loads(pathlib.Path(f"{temp}/hive-release-provenance-attested.json").read_text(encoding="utf-8"))
          attestation = document["attestation"]
          if attestation["status"] != "generated":
              raise SystemExit("REFUSING_TO_RECORD_VERIFICATION_OVER_A_HELD_STATE")
          attestation["status"] = "verified"
          attestation["verification"] = "passed"
          pathlib.Path(f"{temp}/hive-release-provenance-verified.json").write_text(
              serialize_provenance(document), encoding="utf-8"
          )
          PY
          "$PYTHON_BIN" -m tools.desktop.release_provenance --transition \
            --before "$RUNNER_TEMP/hive-release-provenance-attested.json" \
            --after "$RUNNER_TEMP/hive-release-provenance-verified.json"
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-verified.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Admission gate must still refuse for want of publisher signing
        shell: bash
        run: |
          set -euo pipefail
          out="$("$PYTHON_BIN" -m tools.desktop.release_provenance --gate \
            --provenance "$RUNNER_TEMP/hive-release-provenance-verified.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST" || true)"
          echo "$out"
          echo "$out" | grep -qx "RELEASE_GATE=DENY"
          echo "$out" | grep -qx "REASON=publisher-signing-unverified:msi"
          echo "$out" | grep -qx "REASON=publisher-signing-unverified:nsis"
          if echo "$out" | grep -q "build-provenance-attestation-unverified"; then
            echo "VERIFIED_ATTESTATION_DID_NOT_CLEAR_PROVENANCE"; exit 1
          fi
          echo "SEPARATION_PROOF=VERIFIED_ATTESTATION_DOES_NOT_SATISFY_PUBLISHER_SIGNING"
      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-release-evidence-windows-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            ${{ runner.temp }}/hive-package-inventory.json
            ${{ runner.temp }}/hive-release-provenance-baseline.json
            ${{ runner.temp }}/hive-release-provenance-attested.json
            ${{ runner.temp }}/hive-release-provenance-verified.json

  build-attest-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: [preflight, probe-release-protection]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_BIN: python3
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Re-assert the objective environment verdict
        shell: bash
        env:
          PROVEN: ${{ needs.probe-release-protection.outputs.proven }}
        run: |
          set -euo pipefail
          test "$PROVEN" = "true"
          echo "ENVIRONMENT_PROTECTION_PROVEN=true"
      # actions/checkout@v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$EXPECTED_SHA"
          echo "CANARY_PLATFORM=linux"
          uname -a
      - name: Install minimal Tauri Linux system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf file
      # actions/setup-node@v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.CANONICAL_NODE_VERSION }}
      # actions-rust-lang/setup-rust-toolchain@v1.17.0
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: ${{ env.CANONICAL_RUST_TOOLCHAIN }}
          cache: true
          rust-src-dir: apps/desktop/src-tauri
          cache-shared-key: hive-protected-release-linux-v1
      - name: Generate deterministic Hive desktop icon
        run: python3 tools/desktop/generate_icon.py
      - name: Install exact npm graph
        working-directory: apps/desktop
        run: npm ci --ignore-scripts --no-audit
      - name: Record pinned CLI and advertised bundle targets
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_CLI_VERSION=$(node -e "process.stdout.write(require('@tauri-apps/cli/package.json').version)")"
          npm run tauri -- bundle --help > "$RUNNER_TEMP/bundle-help.txt" 2>&1 || true
          VALUES="$(grep -o 'possible values:.*' "$RUNNER_TEMP/bundle-help.txt" | head -1)"
          echo "BUNDLE_VALUES=$VALUES"
          for target in appimage deb; do
            case "$VALUES" in
              *"$target"*) ;;
              *) echo "TARGET_NOT_ADVERTISED=$target"; exit 1 ;;
            esac
          done
      - name: Derive canonical version and identifier from Tauri config
        shell: bash
        run: |
          set -euo pipefail
          DRIFT="$(python3 tools/desktop/version_drift.py)"
          echo "$DRIFT"
          case "$DRIFT" in
            *"VERSION_DRIFT=LOCKED"*) ;;
            *) echo "VERSION_DRIFT_NOT_LOCKED"; exit 1 ;;
          esac
          VERSION="$(python3 -c "import json;print(json.load(open('$TAURI_CONFIG',encoding='utf-8'))['version'])")"
          IDENTIFIER="$(python3 -c "import json;print(json.load(open('$TAURI_CONFIG',encoding='utf-8'))['identifier'])")"
          test -n "$VERSION"
          test -n "$IDENTIFIER"
          echo "CANONICAL_CONFIG_SOURCE=$TAURI_CONFIG"
          echo "DERIVED_CANONICAL_VERSION=$VERSION"
          echo "DERIVED_CANONICAL_IDENTIFIER=$IDENTIFIER"
          { echo "CANONICAL_VERSION=$VERSION"; echo "CANONICAL_IDENTIFIER=$IDENTIFIER"; } >> "$GITHUB_ENV"
      - name: Native compile without bundling
        working-directory: apps/desktop
        run: npm run tauri -- build --no-bundle --features rfd/gtk3
      - name: Create ephemeral bundle overlay (runner-local, non-tracked)
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="$RUNNER_TEMP/hive-bundle-overlay.json"
          test -f apps/desktop/src-tauri/icons/icon.ico
          test -f apps/desktop/src-tauri/icons/icon.png
          printf '%s' '{"bundle":{"icon":["icons/icon.ico","icons/icon.png"]}}' > "$OVERLAY"
          echo "OVERLAY_PATH=$OVERLAY"
          BEFORE="$(sha256sum "$TAURI_CONFIG" | cut -d' ' -f1)"
          echo "TAURI_CONF_SHA256_BEFORE=$BEFORE"
          echo "TAURI_CONF_BEFORE=$BEFORE" >> "$GITHUB_ENV"
      - name: Explicit bundle with ephemeral overlay
        working-directory: apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src-tauri/target/release/bundle
          for attempt in 1 2; do
            echo "BUNDLE_ATTEMPT=$attempt"
            if npm run tauri -- bundle --bundles deb,appimage --ci --config "$RUNNER_TEMP/hive-bundle-overlay.json"; then
              echo "BUNDLE_RESULT=SUCCESS attempt=$attempt"
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "BUNDLE_RESULT=FAILED attempts=$attempt"
              exit 1
            fi
            echo "BUNDLE_RESULT=RETRY attempt=$attempt"
            sleep 15
          done
      - name: Guard tracked source and canonical config after bundling
        shell: bash
        run: |
          set -euo pipefail
          echo "TAURI_CONF_SHA256_AFTER=$(sha256sum "$TAURI_CONFIG" | cut -d' ' -f1)"
          test "$(sha256sum "$TAURI_CONFIG" | cut -d' ' -f1)" = "$TAURI_CONF_BEFORE"
          git diff --quiet --exit-code
          echo "TRACKED_SOURCE_UNCHANGED=PASS"
      - name: Native structural checks (no install, no execution)
        shell: bash
        run: |
          set -euo pipefail
          root="$PACKAGE_ROOT"
          appimage="$(find "$root/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find "$root/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          test -s "$appimage"
          test -x "$appimage" || { echo "APPIMAGE_NOT_EXECUTABLE"; exit 1; }
          test "$(dpkg-deb -f "$deb" Version)" = "$CANONICAL_VERSION" || { echo "DEB_VERSION_MISMATCH"; exit 1; }
          echo "STRUCTURAL_CHECK_LINUX=PASS"
      - name: Deterministic package inventory
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" tools/desktop/package_inventory.py \
            --package-root "$PACKAGE_ROOT" \
            --platform linux --architecture "$(uname -m)" \
            --source-sha "$SOURCE_SHA" --canonical-version "$CANONICAL_VERSION" \
            --expected-types deb,appimage --json-out "$RUNNER_TEMP/hive-package-inventory.json" > /dev/null
          test -s "$RUNNER_TEMP/hive-package-inventory.json"
          echo "PACKAGE_INVENTORY_MANIFEST=$RUNNER_TEMP/hive-package-inventory.json" >> "$GITHUB_ENV"
          echo "OVERLAY_UPLOADED=NO"
      - name: Prove the bound inventory bytes are canonical
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import canonical_bytes

          raw = pathlib.Path(os.environ["PACKAGE_INVENTORY_MANIFEST"]).read_bytes()
          canonical = canonical_bytes(json.loads(raw))
          if raw != canonical:
              raise SystemExit("INVENTORY_BYTES_ARE_NOT_CANONICAL")
          print("INVENTORY_BYTES_ARE_CANONICAL=PASS")
          PY
      - name: Build credential-free provenance baseline
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" -m tools.desktop.release_provenance --build \
            --inventory "$PACKAGE_INVENTORY_MANIFEST" --release-channel "$RELEASE_CHANNEL" \
            --json-out "$RUNNER_TEMP/hive-release-provenance-baseline.json" > /dev/null
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-baseline.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
          echo "PROVENANCE_BASELINE=$RUNNER_TEMP/hive-release-provenance-baseline.json" >> "$GITHUB_ENV"
      # actions/attest@v4.2.2 — see the Windows lane for why the subjects are the
      # package identities derived from the validated inventory rather than a
      # filesystem glob that could silently add or drop an adjacent artifact.
      - name: Derive the attestation subjects from the validated inventory
        shell: bash
        run: |
          set -euo pipefail
          SUBJECT_NAME="$("$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import attestation_subjects, render_attestation_checksums

          manifest = pathlib.Path(os.environ["PACKAGE_INVENTORY_MANIFEST"])
          inventory = json.loads(manifest.read_text(encoding="utf-8"))
          subjects = attestation_subjects(inventory)
          checksums = pathlib.Path(os.environ["RUNNER_TEMP"], "hive-attestation-subjects.txt")
          checksums.write_text(render_attestation_checksums(inventory), encoding="utf-8", newline="\n")
          print(f"ATTESTATION_SUBJECT_COUNT={len(subjects)}", file=sys.stderr)
          for subject in subjects:
              print(f"ATTESTATION_SUBJECT={subject['name']} identity={subject['identityKind']}", file=sys.stderr)
          print(next(subject["name"] for subject in subjects if subject["identityKind"] == "file-bytes"))
          PY
          )"
          echo "ATTESTATION_SUBJECTS_FILE=$RUNNER_TEMP/hive-attestation-subjects.txt" >> "$GITHUB_ENV"
          echo "ATTESTATION_VERIFY_TARGET=$PACKAGE_ROOT/$SUBJECT_NAME" >> "$GITHUB_ENV"
          test -s "$RUNNER_TEMP/hive-attestation-subjects.txt"
      - name: Attest the release packages
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: ${{ runner.temp }}/hive-attestation-subjects.txt
      - name: Independently verify the attestation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          SOURCE_REF: ${{ github.ref }}
          SIGNER_IDENTITY: ${{ format('{0}@{1}', github.repository, github.ref) }}
          SIGNER_WORKFLOW_ID: ${{ github.repository }}/.github/workflows/protected-release.yml
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
        run: |
          set -euo pipefail
          # The bundle path is handed straight to the verifier. On a Windows runner it
          # is a native path, and copying it through cp/test -s is how lanes break there.
          # The target is one of the attested packages, not the manifest: the verifier
          # matches a supplied file against the statement by digest alone, so this step
          # proves the signature, the transparency record and the identity policy, and
          # says nothing about the other subjects. The next step proves the whole set.
          gh attestation verify "$ATTESTATION_VERIFY_TARGET" \
            --repo "$GITHUB_REPOSITORY" --bundle "$BUNDLE" \
            --signer-repo "$GITHUB_REPOSITORY" --signer-workflow "$SIGNER_WORKFLOW_ID" \
            --source-ref "$SOURCE_REF" --deny-self-hosted-runners
          echo "ATTESTATION_VERIFICATION=PASSED"
          echo "ATTESTATION_ID=$ATTESTATION_ID"
          echo "SIGNER_IDENTITY=$SIGNER_IDENTITY" >> "$GITHUB_ENV"
          echo "ATTESTATION_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Prove the attestation subjects are exactly this release's packages
        shell: bash
        run: |
          set -euo pipefail
          # The verifier above matched one artifact against the statement by digest and
          # said nothing about the rest of the set, so the bundle is decoded and compared
          # here: a statement missing a package, carrying one the inventory never
          # recorded, or signed over something other than build provenance fails this
          # step instead of passing unnoticed.
          "$PYTHON_BIN" -m tools.desktop.release_provenance --attest-subjects \
            --attest-bundle "$ATTESTATION_BUNDLE" --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Record the attestation as generated, proving the advance is legal
        shell: bash
        env:
          SOURCE_REF: ${{ github.ref }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import hashlib, json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import serialize_provenance

          temp = os.environ["RUNNER_TEMP"]
          document = json.loads(pathlib.Path(f"{temp}/hive-release-provenance-baseline.json").read_text(encoding="utf-8"))
          bundle = pathlib.Path(os.environ["ATTESTATION_BUNDLE"]).read_bytes()
          document["attestation"] = {
              "status": "generated",
              "verification": "none",
              "signerWorkflow": os.environ["SIGNER_IDENTITY"],
              "sourceRef": os.environ["SOURCE_REF"],
              "runId": int(os.environ["RUN_ID"]),
              "bundleDigest": hashlib.sha256(bundle).hexdigest(),
          }
          pathlib.Path(f"{temp}/hive-release-provenance-attested.json").write_text(
              serialize_provenance(document), encoding="utf-8"
          )
          PY
          "$PYTHON_BIN" -m tools.desktop.release_provenance --transition \
            --before "$PROVENANCE_BASELINE" --after "$RUNNER_TEMP/hive-release-provenance-attested.json"
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-attested.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
      - name: Record the passed verification, proving the advance is legal
        shell: bash
        run: |
          set -euo pipefail
          "$PYTHON_BIN" - <<'PY'
          import json, os, pathlib, sys

          sys.path.insert(0, os.getcwd())
          from tools.desktop.release_provenance import serialize_provenance

          temp = os.environ["RUNNER_TEMP"]
          document = json.loads(pathlib.Path(f"{temp}/hive-release-provenance-attested.json").read_text(encoding="utf-8"))
          attestation = document["attestation"]
          if attestation["status"] != "generated":
              raise SystemExit("REFUSING_TO_RECORD_VERIFICATION_OVER_A_HELD_STATE")
          attestation["status"] = "verified"
          attestation["verification"] = "passed"
          pathlib.Path(f"{temp}/hive-release-provenance-verified.json").write_text(
              serialize_provenance(document), encoding="utf-8"
          )
          PY
          "$PYTHON_BIN" -m tools.desktop.release_provenance --transition \
            --before "$RUNNER_TEMP/hive-release-provenance-attested.json" \
            --after "$RUNNER_TEMP/hive-release-provenance-verified.json"
          "$PYTHON_BIN" -m tools.desktop.release_provenance --verify \
            --provenance "$RUNNER_TEMP/hive-release-provenance-verified.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST"
      # The separation proof has a second half. Linux has no enforceable
      # publisher-trust model, so once provenance is attested and verified its honest
      # gate is provenance plus artifact integrity: demanding a signature here would
      # be a fabricated guarantee, and refusing publication here for want of one would
      # be a lie about what the platform can promise.
      - name: Admission gate must not invent a publisher-signing requirement
        shell: bash
        run: |
          set -euo pipefail
          out="$("$PYTHON_BIN" -m tools.desktop.release_provenance --gate \
            --provenance "$RUNNER_TEMP/hive-release-provenance-verified.json" \
            --inventory "$PACKAGE_INVENTORY_MANIFEST")"
          echo "$out"
          echo "$out" | grep -qx "RELEASE_GATE=ALLOW"
          if echo "$out" | grep -q "publisher-signing-unverified"; then
            echo "GATE_INVENTED_A_PUBLISHER_REQUIREMENT_FOR_LINUX"; exit 1
          fi
          echo "SEPARATION_PROOF=NO_PUBLISHER_TRUST_MODEL_DEMANDED"
      # actions/upload-artifact@v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hive-release-evidence-linux-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            ${{ runner.temp }}/hive-package-inventory.json
            ${{ runner.temp }}/hive-release-provenance-baseline.json
            ${{ runner.temp }}/hive-release-provenance-attested.json
            ${{ runner.temp }}/hive-release-provenance-verified.json

