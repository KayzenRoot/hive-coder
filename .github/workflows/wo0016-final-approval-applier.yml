name: WO0016 Final Approval Applier

on:
  push:
    branches: [feat/HCODER-WO-0016-trusted-workspace-git-read]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[wo16-final-approved]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/HCODER-WO-0016-trusted-workspace-git-read
          fetch-depth: 0
      - name: Apply exact guarded approval patch
        run: python tools/engineering/apply_wo0016_final_approval.py
      - name: Verify approval delta
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          echo "$changed"
          test "$(echo "$changed" | wc -l)" -eq 4
          echo "$changed" | grep -Fx '.engineering/evidence/HCODER-WO-0016.md'
          echo "$changed" | grep -Fx '.engineering/work-orders/HCODER-WO-0016.md'
          echo "$changed" | grep -Fx 'docs/project-brain/10-DECISIONS-LEDGER.md'
          echo "$changed" | grep -Fx 'docs/project-brain/11-CHECKPOINT.md'
      - name: Commit final approval and remove temporary applier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .engineering/evidence/HCODER-WO-0016.md .engineering/work-orders/HCODER-WO-0016.md docs/project-brain/10-DECISIONS-LEDGER.md docs/project-brain/11-CHECKPOINT.md
          git rm tools/engineering/apply_wo0016_final_approval.py .github/workflows/wo0016-final-approval-applier.yml
          git commit -m "[wo16-final-approved] HCODER-WO-0016: final approval candidate"
          git push origin HEAD:feat/HCODER-WO-0016-trusted-workspace-git-read
