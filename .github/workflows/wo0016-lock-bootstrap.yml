name: WO0016 Lock Bootstrap

on:
  push:
    branches:
      - feat/HCODER-WO-0016-trusted-workspace-git-read

jobs:
  resolve-rust-lock:
    if: github.repository == 'KayzenRoot/hive-coder'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: false
      - name: Resolve declared Cargo graph
        shell: pwsh
        run: |
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 | Out-Null
      - name: Show lock delta
        shell: pwsh
        run: git diff -- apps/desktop/src-tauri/Cargo.lock
      - uses: actions/upload-artifact@v4
        with:
          name: wo0016-cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
