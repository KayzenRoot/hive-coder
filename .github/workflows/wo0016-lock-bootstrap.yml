name: WO0016 Lock Bootstrap

on:
  push:
    branches:
      - feat/HCODER-WO-0016-trusted-workspace-git-read

permissions:
  contents: write

jobs:
  resolve-rust-lock:
    if: github.repository == 'KayzenRoot/hive-coder'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
          cache: false
      - name: Resolve declared Cargo graph
        shell: pwsh
        run: |
          cargo update --manifest-path apps/desktop/src-tauri/Cargo.toml
          cargo metadata --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --no-deps --format-version 1 | Out-Null
      - name: Validate lock-only delta and commit when needed
        shell: pwsh
        run: |
          $expected = "apps/desktop/src-tauri/Cargo.lock"
          $changed = @(git diff --name-only)
          if ($changed.Count -gt 0) {
            if ($changed.Count -ne 1 -or $changed[0] -ne $expected) {
              throw "bootstrap produced unexpected changes: $($changed -join ', ')"
            }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- $expected
            git commit -m "HCODER-WO-0016: resolve native picker Cargo lock"
            git push origin HEAD:feat/HCODER-WO-0016-trusted-workspace-git-read
            Write-Output "LOCK_COMMITTED=1"
          }
          else {
            Write-Output "LOCK_COMMITTED=0"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wo0016-cargo-lock
          path: apps/desktop/src-tauri/Cargo.lock
          if-no-files-found: error
          retention-days: 1
