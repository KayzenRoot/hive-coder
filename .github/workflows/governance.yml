name: Governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  source-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$ACTUAL_SHA"
      - name: Verify canonical source pack
        shell: bash
        run: |
          set -euo pipefail
          required=(AGENTS.md docs/project-brain/00-SOURCE-HIERARCHY.md docs/project-brain/01-PROJECT-OVERVIEW.md docs/project-brain/02-REQUIREMENTS.md docs/project-brain/03-SCOPE.md docs/project-brain/04-ARCHITECTURE.md docs/project-brain/05-SECURITY.md docs/project-brain/06-TEST-BENCHMARK-PLAN.md docs/project-brain/07-DEPLOYMENT.md docs/project-brain/08-BACKLOG.md docs/project-brain/09-DEFINITION-OF-DONE.md docs/project-brain/10-DECISIONS-LEDGER.md docs/project-brain/11-CHECKPOINT.md docs/project-brain/12-UI-UX.md docs/project-brain/13-INTEGRATION-CONTRACTS.md docs/project-brain/14-LICENSE-PROVENANCE.md docs/security/PERMISSION-CONTROL-PLANE.md .engineering/gef/GEF-POLICY.md .engineering/gef/GEF-EXECUTION-PROTOCOL.md .engineering/gef/GEF-REVIEW-PROTOCOL.md .engineering/gef/GEF-EVIDENCE-SPEC.md)
          for f in "${required[@]}"; do test -s "$f" || { echo "missing/empty: $f"; exit 1; }; done
      - name: Validate JSON contracts
        run: |
          python -m json.tool .engineering/gef/GEF-PROJECT-PROFILE.json >/dev/null
          python -m json.tool .engineering/templates/CONTEXT-LOCK-TEMPLATE.json >/dev/null
          python -m json.tool foundations/foundations.lock.json >/dev/null
          python -m json.tool foundations/python-dependencies.lock.json >/dev/null
          for f in .engineering/context-locks/*.json; do python -m json.tool "$f" >/dev/null; done
      - name: Verify foundation lock
        run: python tools/foundations/verify_lock.py
      - name: Foundation inventory doctor
        run: python tools/foundations/doctor.py --inventory-only
      - name: Install governed Python dependencies
        run: python -m pip install --no-deps --require-hashes -r foundations/python-dependencies.requirements.txt
      - name: Verify governed Python dependency lock
        run: python tools/foundations/verify_python_dependencies.py
      - name: Compile Python runtime and tools
        run: python -m compileall -q hive_runtime tools
      - name: Unit tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest discover -s tests -p "test_*.py"

  governed-runtime-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head and Linux runner identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$ACTUAL_SHA"
          uname -a
          cat /etc/os-release
          python --version
      - name: Compile governed filesystem runtime
        run: python -m compileall -q hive_runtime
      - name: Install governed Python dependencies
        run: python -m pip install --no-deps --require-hashes -r foundations/python-dependencies.requirements.txt
      - name: Native Linux governed filesystem proof
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest tests.runtime.test_workspace_files tests.runtime.test_workspace_file_path_security tests.runtime.test_workspace_file_replace_contract tests.runtime.test_workspace_file_replace_security
      - name: Native Linux governed Git staging proof (codec, object, authority, E2E)
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest tests.runtime.test_git_index_envelope tests.runtime.test_git_stage_contract tests.runtime.test_git_object_candidate tests.runtime.test_git_object_store_inspector tests.runtime.test_git_loose_object_transaction tests.runtime.test_git_stage_index_codec tests.runtime.test_git_object_private_prep tests.runtime.test_git_stage_security tests.runtime.test_git_stage_tree_cache_semantics tests.runtime.test_git_stage_authority

  control-plane-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "exact-head mismatch: $actual != $env:EXPECTED_SHA" }
          Write-Output "EXACT_HEAD_OK=$actual"
      - name: Compile control plane and Cua harness
        run: python -m compileall -q hive_runtime
      - name: Install governed Python dependencies
        run: python -m pip install --no-deps --require-hashes -r foundations/python-dependencies.requirements.txt
      - name: HIGH_ASSURANCE control-plane, executor, real-harness, workspace-file and status-sidecar contract tests
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest tests.control_plane.test_control_plane tests.control_plane.test_surface tests.runtime.test_cua_executor tests.runtime.test_cua_real_harness tests.runtime.test_workspace_files tests.runtime.test_workspace_file_path_security tests.runtime.test_workspace_files_windows tests.runtime.test_workspace_file_replace_windows_contract tests.runtime.test_runtime_status_sidecar
      - name: Native Windows HIGH_ASSURANCE governed Git staging proof (codec, object, authority, E2E)
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest tests.runtime.test_git_index_envelope tests.runtime.test_git_stage_contract tests.runtime.test_git_object_candidate tests.runtime.test_git_object_store_inspector tests.runtime.test_git_loose_object_transaction tests.runtime.test_git_stage_index_codec tests.runtime.test_git_object_private_prep tests.runtime.test_git_stage_security tests.runtime.test_git_stage_tree_cache_semantics tests.runtime.test_git_stage_authority

  workspace-replace-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact-head checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "EXACT_HEAD_OK=$ACTUAL_SHA"
          sw_vers
          python --version
      - name: Compile governed filesystem runtime
        run: python -m compileall -q hive_runtime
      - name: Install governed Python dependencies
        run: python -m pip install --no-deps --require-hashes -r foundations/python-dependencies.requirements.txt
      - name: Native macOS bounded-race atomic replacement proof
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: python -m unittest tests.runtime.test_workspace_file_replace_contract tests.runtime.test_workspace_file_replace_security
      - name: Native macOS governed Git staging proof (codec, object, authority, E2E)
        env:
          PYTHONWARNINGS: error::ResourceWarning
        run: |
          python -m unittest tests.runtime.test_git_index_envelope tests.runtime.test_git_stage_contract tests.runtime.test_git_object_candidate tests.runtime.test_git_object_store_inspector tests.runtime.test_git_loose_object_transaction tests.runtime.test_git_stage_index_codec tests.runtime.test_git_object_private_prep tests.runtime.test_git_stage_security tests.runtime.test_git_stage_tree_cache_semantics tests.runtime.test_git_stage_authority
