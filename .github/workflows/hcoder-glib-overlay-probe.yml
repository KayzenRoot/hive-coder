# HCODER-SEC-0001 Delta 004: NEVER MERGE. Linux-only scratch Cargo overlay diagnostic.
name: HCODER glib overlay probe
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hcoder-glib-overlay-probe.yml"
permissions:
  contents: read

jobs:
  linux-glib-overlay-probe:
    if: ${{ github.head_ref == 'security/HCODER-SEC-0001-glib-overlay-probe' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact PR candidate, no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify frozen product and source HEAD
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object apps/desktop/src-tauri/Cargo.lock)" = "517f181e3c0e1e281e12e270ae2b5e23922c5f35"
          test "$(git hash-object apps/desktop/src-tauri/Cargo.toml)" = "2ab3c506dff4ff9c546a523941536678632fb2f9"
          test "$(git hash-object apps/desktop/src-tauri/src/update_admission.rs)" = "234e40fdd5d805e30d44f824a3cea416d348b7c9"
          echo "SOURCE_SHA=$EXPECTED_HEAD"
          echo "FROZEN_PRODUCT_SOURCE=PASS"
      - name: Linux Tauri native prereqs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Fetch exact current locked crates.io source and verified Debian archive anchors
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          cargo fetch --locked --target x86_64-unknown-linux-gnu --manifest-path apps/desktop/src-tauri/Cargo.toml
          dir="$RUNNER_TEMP/hcoder-glib-overlay"
          mkdir -p "$dir"
          cd "$dir"
          base="https://deb.debian.org/debian/pool/main/r/rust-glib-0.18"
          for f in rust-glib-0.18_0.18.5-7.debian.tar.xz rust-glib-0.18_0.18.5.orig.tar.gz; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 2 --max-time 120 --output "$f" "$base/$f"
            test -s "$f"
          done
          echo '9895cf4df3525224ee825477dc76c730566591528b9af9fc05c310706b61db5b  rust-glib-0.18_0.18.5-7.debian.tar.xz' | sha256sum -c -
          echo 'faddac41a88c061d4dd577b465ed24ef2b5173c2b0602fc97ae039bbe0079e5c  rust-glib-0.18_0.18.5.orig.tar.gz' | sha256sum -c -
          echo "DEBIAN_PROVENANCE_ANCHOR=previous_signed_dsc_run_36591726532"
      - name: Create checked scratch sources, apply only authenticated fix and run negative integrity cases
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/hcoder-glib-overlay" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib, os, re, shutil, sys, tarfile, tomllib
          from pathlib import Path, PurePosixPath
          folder, repo = map(Path, sys.argv[1:])
          original = repo / "apps/desktop/src-tauri/Cargo.lock"
          doc = tomllib.loads(original.read_text())
          glib = [p for p in doc["package"] if p["name"] == "glib" and p["version"] == "0.18.5"]
          if len(glib) != 1 or not re.fullmatch(r"[0-9a-f]{64}", glib[0].get("checksum", "")):
              raise SystemExit("FAIL: no unique checksum-bound locked glib")
          registry = Path.home() / ".cargo/registry/cache"
          crates = list(registry.glob("*/glib-0.18.5.crate"))
          if len(crates) != 1:
              raise SystemExit(f"FAIL: expected one fetched glib crate, found {len(crates)}")
          crate_file = crates[0]
          digest = hashlib.sha256(crate_file.read_bytes()).hexdigest()
          if digest != glib[0]["checksum"]:
              raise SystemExit("FAIL: crates.io cache crate checksum mismatch")
          print(f"LOCKED_GLIB_CRATE_SHA256={digest}")
          extracted = folder / "locked-original"
          extracted.mkdir()
          with tarfile.open(crate_file, "r:gz") as tf:
              seen=set();total=0
              for m in tf.getmembers():
                  norm=m.name.removeprefix("./")
                  pp=PurePosixPath(norm)
                  if pp.is_absolute() or ".." in pp.parts or not norm.startswith("glib-0.18.5/") or norm in seen or m.issym() or m.islnk() or m.isdev():
                      raise SystemExit("FAIL: unsafe or duplicate crates.io member")
                  seen.add(norm)
                  if m.isfile():
                      total+=m.size
                      if m.size>2_000_000 or total>12_000_000:
                          raise SystemExit("FAIL: oversized registry source")
                  elif not m.isdir():
                      raise SystemExit("FAIL: unexpected registry source type")
              tf.extractall(extracted, filter="data")
          root=extracted / "glib-0.18.5"
          source = root / "src/variant_iter.rs"
          original_bytes = source.read_bytes()
          deb_orig = folder / "rust-glib-0.18_0.18.5.orig.tar.gz"
          with tarfile.open(deb_orig, "r:gz") as tf:
              matches=[m for m in tf.getmembers() if m.isfile() and m.name.endswith("/src/variant_iter.rs") and m.size<300_000]
              if len(matches)!=1:
                  raise SystemExit("FAIL: signed Debian original lacks unique vulnerable file")
              signed_orig_bytes=tf.extractfile(matches[0]).read()
          if signed_orig_bytes != original_bytes:
              raise SystemExit("FAIL: signed Debian original and locked crates.io source differ at security preimage")
          print("LOCKED_SOURCE_EQUALS_SIGNED_DEBIAN_ORIG=1")
          deb = folder / "rust-glib-0.18_0.18.5-7.debian.tar.xz"
          patchname="debian/patches/0007-glib-fix-UB-in-VariantStrIter-impl_get.patch"
          with tarfile.open(deb, "r:xz") as tf:
              matches=[m for m in tf.getmembers() if m.name.removeprefix("./")==patchname and m.isfile() and m.size<100_000]
              if len(matches)!=1:
                  raise SystemExit("FAIL: official Debian patch missing or ambiguous")
              patch_bytes=tf.extractfile(matches[0]).read()
              series=[m for m in tf.getmembers() if m.name.removeprefix("./")=="debian/patches/series" and m.isfile()]
              if len(series)!=1 or "0007-glib-fix-UB-in-VariantStrIter-impl_get.patch" not in tf.extractfile(series[0]).read().decode("utf-8").split():
                  raise SystemExit("FAIL: patch absent from Debian quilt series")
          expected="9a3b06ad9a7d5d459d44ee5ab05557720992b8d214bfea14c5e9b4ae4f5702eb"
          if hashlib.sha256(patch_bytes).hexdigest()!=expected:
              raise SystemExit("FAIL: signed provenance patch digest mismatch")
          text=patch_bytes.decode("utf-8")
          if "src/variant_iter.rs | 4 ++--" not in text or text.count("diff --git ") != 1 or "diff --git a/src/variant_iter.rs b/src/variant_iter.rs" not in text:
              raise SystemExit("FAIL: unexpected security patch paths/scope")
          checks=[r"(?m)^-\s*let p: \*mut libc::c_char = std::ptr::null_mut\(\);$",r"(?m)^\+\s*let mut p: \*mut libc::c_char = std::ptr::null_mut\(\);$",r"(?m)^-\s*&p,$",r"(?m)^\+\s*&mut p,$"]
          if not all(re.search(s,text) for s in checks):
              raise SystemExit("FAIL: missing upstream safety replacement hunk")
          patchfile=folder/"verified-security.patch"
          patchfile.write_bytes(patch_bytes)
          patched=folder/"patched"/"glib-0.18.5"
          shutil.copytree(root,patched,symlinks=False)
          print(f"VERIFIED_SECURITY_PATCH_SHA256={expected}")
          print("PATCHED_COPY_PATH="+str(patched))
          (folder/"registry-preimage.sha256").write_text(hashlib.sha256(original_bytes).hexdigest())
          (folder/"glib-lock-checksum").write_text(digest)
          PY
          dir="$RUNNER_TEMP/hcoder-glib-overlay"
          patched="$dir/patched/glib-0.18.5"
          patchfile="$dir/verified-security.patch"
          patch --batch --forward --fuzz=0 -d "$patched" -p1 < "$patchfile"
          python3 - "$dir" <<'PY'
          import hashlib, shutil, subprocess, sys
          from pathlib import Path
          d=Path(sys.argv[1])
          pristine=d/"locked-original/glib-0.18.5"
          patched=d/"patched/glib-0.18.5"
          old=(pristine/"src/variant_iter.rs").read_text()
          new=(patched/"src/variant_iter.rs").read_text()
          assert old.count("let p: *mut libc::c_char = std::ptr::null_mut();")==1
          assert new.count("let mut p: *mut libc::c_char = std::ptr::null_mut();")==1
          assert new.count("&mut p,")==1
          expected=old.replace("let p: *mut libc::c_char = std::ptr::null_mut();","let mut p: *mut libc::c_char = std::ptr::null_mut();",1).replace("&p,","&mut p,",1)
          if expected!=new:
              raise SystemExit("FAIL: patched bytes differ from exact two-line upstream change")
          for src in pristine.rglob("*"):
              if not src.is_file(): continue
              relative=src.relative_to(pristine)
              dst=patched/relative
              if not dst.is_file():
                  raise SystemExit("FAIL: patched source file missing")
              if relative!=Path("src/variant_iter.rs") and src.read_bytes()!=dst.read_bytes():
                  raise SystemExit("FAIL: unexpected patched source modification")
          files=[p for p in patched.rglob("*") if p.is_file()]
          if len(files)!=len([p for p in pristine.rglob("*") if p.is_file()]):
              raise SystemExit("FAIL: extra patch-created files")
          print("ONLY_EXACT_UPSTREAM_TWO_LINE_DIFF=1")
          tamper=d/"tampered.patch"
          tamper.write_bytes((d/"verified-security.patch").read_bytes()+b"UNAPPROVED")
          if hashlib.sha256(tamper.read_bytes()).hexdigest()=="9a3b06ad9a7d5d459d44ee5ab05557720992b8d214bfea14c5e9b4ae4f5702eb":
              raise SystemExit("FAIL: corrupt patch not rejected")
          print("NEGATIVE_CORRUPTED_PATCH=REJECTED")
          replay=subprocess.run(["patch","--dry-run","--batch","--forward","--fuzz=0","-d",str(patched),"-p1"],input=(d/"verified-security.patch").read_bytes(),stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
          if replay.returncode==0:
              raise SystemExit("FAIL: patch re-application unexpectedly accepted")
          print("NEGATIVE_PATCH_REPLAY=REJECTED")
          PY
      - name: Generate exact original desktop assets in repo, clone Rust+frontend into temp only
        shell: bash
        run: |
          set -euo pipefail
          python tools/desktop/generate_icon.py
          cd apps/desktop
          npm ci --ignore-scripts --no-audit
          npm run build:web
          cd ../..
          temp="$RUNNER_TEMP/hcoder-glib-overlay/desktop-scratch"
          mkdir -p "$temp"
          cp -a apps/desktop/src-tauri "$temp/src-tauri"
          cp -a apps/desktop/dist "$temp/dist"
          git diff --quiet --exit-code
          echo "TRACKED_PRODUCT_UNCHANGED=1"
      - name: Resolve exact patched scratch Cargo graph; run Rust checks and tests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/hcoder-glib-overlay"
          src="$d/patched/glib-0.18.5"
          app="$d/desktop-scratch/src-tauri/Cargo.toml"
          cfg="patch.crates-io.glib.path=\"$src\""
          # Cargo normally caps lints on registry dependencies, but a local path glib
          # inherits the runner global -D warnings. Do NOT relax app or other crates.
          wrapper="$d/glib-rustc-wrapper.sh"
          cat > "$wrapper" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          rustc="$1"; shift
          if [[ " $* " == *" --crate-name glib "* ]] && [[ " $* " == *"$HCODER_PATCHED_GLIB_PATH/src/lib.rs"* ]]; then
            echo "LEGACY_GLIB_ONLY_LINT_ALLOWLIST_APPLIED=1" >&2
            exec "$rustc" "$@" -A unused_parens -A mismatched_lifetime_syntaxes
          fi
          exec "$rustc" "$@"
          SH
          chmod 0755 "$wrapper"
          export HCODER_PATCHED_GLIB_PATH="$src"
          export RUSTC_WRAPPER="$wrapper"
          echo "HCODER_PATCHED_GLIB_PATH=$src" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=$wrapper" >> "$GITHUB_ENV"
          echo "LEGACY_GLIB_ONLY_ALLOWLIST=unused_parens,mismatched_lifetime_syntaxes"
          cargo --config "$cfg" metadata --manifest-path "$app" --format-version 1 > "$d/cargo-metadata.json"
          python3 - "$d" <<'PY'
          import json,sys
          from pathlib import Path
          d=Path(sys.argv[1]);j=json.loads((d/"cargo-metadata.json").read_text())
          matches=[p for p in j["packages"] if p["name"]=="glib" and p["version"]=="0.18.5"]
          if len(matches)!=1 or Path(matches[0]["manifest_path"]).resolve()!= (d/"patched/glib-0.18.5/Cargo.toml").resolve():
              raise SystemExit("FAIL: patched glib source is not the single resolved Cargo source")
          extra=[p for p in j["packages"] if p["name"]=="glib" and p["version"]!="0.18.5"]
          if extra: raise SystemExit("FAIL: another unapproved glib version in graph")
          print("SINGLE_GLIB_PATCHED_OVERLAY=1")
          print("PATCHED_GLIB_MANIFEST="+matches[0]["manifest_path"])
          PY
          cargo --config "$cfg" tree --locked --manifest-path "$app" --target x86_64-unknown-linux-gnu --features rfd/gtk3 -i glib@0.18.5 > "$d/patched-cargo-tree.txt"
          echo "PATCHED_CARGO_TREE_BEGIN"
          head -n 85 "$d/patched-cargo-tree.txt"
          echo "PATCHED_CARGO_TREE_END"
          python3 - "$d" "$GITHUB_WORKSPACE/apps/desktop/src-tauri/Cargo.lock" <<'PY'
          from pathlib import Path
          import sys,tomllib
          d=Path(sys.argv[1]);original=tomllib.loads(Path(sys.argv[2]).read_text())
          scratch=tomllib.loads((d/"desktop-scratch/src-tauri/Cargo.lock").read_text())
          def norm(doc):
              res=[]
              for p in doc["package"]:
                  q=dict(p)
                  if q["name"]=="glib" and q["version"]=="0.18.5":
                      q.pop("checksum",None)
                      q.pop("source",None)  # expected registry-to-local-source identity change
                  res.append(q)
              return sorted(res,key=lambda p:(p["name"],p["version"],p.get("source","")))
          if norm(original)!=norm(scratch):
              raise SystemExit("FAIL: scratch lock drift outside authenticated glib patch")
          print("SCRATCH_LOCK_ONLY_GLIB_SOURCE_CHANGED=1")
          PY
          cargo --config "$cfg" test --locked --manifest-path "$app" --features rfd/gtk3
          cargo --config "$cfg" check --locked --manifest-path "$app" --features rfd/gtk3
          echo "PINNED_TAURI_UPDATER_COMPILE_AND_TEST=PASS"
      - name: Exercise patched VariantStrIter with release optimization in disposable Rust probe
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/hcoder-glib-overlay"
          probe="$d/variant-regression"
          mkdir -p "$probe/tests"
          cat > "$probe/Cargo.toml" <<EOF
          [package]
          name = "hcoder-glib-variant-regression"
          version = "0.0.0"
          edition = "2024"
          publish = false
          [dependencies]
          glib = { path = "$d/patched/glib-0.18.5" }
          EOF
          cat > "$probe/tests/variant.rs" <<'RS'
          use glib::prelude::*;
          use glib::Variant;
          fn source() -> Variant {
              Variant::array_from_iter::<String>(
                  ["zero", "one", "two", "three", "four"]
                    .iter()
                    .map(|s| s.to_string().to_variant())
              )
          }
          #[test]
          fn combined_front_back_nth_and_nth_back() {
              let value=source();
              let mut it=value.array_iter_str().unwrap();
              assert_eq!(it.next(),Some("zero"));
              assert_eq!(it.next_back(),Some("four"));
              assert_eq!(it.nth(1),Some("two"));
              assert_eq!(it.nth_back(0),Some("three"));
              assert_eq!(it.next(),None);
              assert_eq!(it.next_back(),None);
          }
          #[test]
          fn iterator_last_and_empty() {
              let value=source();
              assert_eq!(value.array_iter_str().unwrap().last(),Some("four"));
              let empty=Variant::array_from_iter::<String>(Vec::<Variant>::new());
              let mut it=empty.array_iter_str().unwrap();
              assert_eq!(it.next(),None);
              assert_eq!(it.last(),None);
          }
          #[test]
          fn overflow_nth_and_nth_back_are_safe() {
              let value=source();
              let mut one=value.array_iter_str().unwrap();
              assert_eq!(one.nth(usize::MAX),None);
              assert_eq!(one.next(),None);
              let mut two=value.array_iter_str().unwrap();
              assert_eq!(two.nth_back(usize::MAX),None);
              assert_eq!(two.next_back(),None);
          }
          #[test]
          fn repeated_full_iteration() {
              let value=source();
              for _ in 0..100 {
                  let found:Vec<_>=value.array_iter_str().unwrap().collect();
                  assert_eq!(found,vec!["zero","one","two","three","four"]);
              }
          }
          RS
          cargo test --release --manifest-path "$probe/Cargo.toml" --test variant
          echo "OPTIMIZED_VARIANT_STR_ITER_TESTS=PASS"
          git diff --quiet --exit-code
          echo "ORIGINAL_TRACKED_SOURCE_UNCHANGED=PASS"
