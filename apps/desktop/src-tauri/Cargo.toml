[package]
name = "hive-coder-desktop"
version = "0.1.0"
description = "Hive Coder desktop shell"
authors = ["Hive Coder"]
edition = "2024"
rust-version = "1.98.1"
license = "UNLICENSED"

[lib]
name = "hive_coder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.11.5", features = [] }
