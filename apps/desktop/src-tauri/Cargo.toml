[package]
name = "hive-coder-desktop"
version = "0.1.0"
description = "Hive Coder desktop shell"
authors = ["Hive Coder"]
edition = "2024"
rust-version = "1.98.1"
publish = false

[lib]
name = "hive_coder_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
rfd = { version = "=0.17.2", default-features = false }
semver = "=1.0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-updater = "=2.12.0"

# HCODER-SEC-0001: requires tools/desktop/bootstrap_glib_patch.py before any Cargo command.
# This generated, checksum-pinned local source is NEVER silently replaced by crates.io.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }
